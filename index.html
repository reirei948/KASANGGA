rting System with a Web-Based Admin Dashboard. After which, data gathering proceeded through surveys, interviews, and review of related literature and systems to establish the foundation for the system's design.<\/p>\n<p>These stakeholders include residents, barangay officials (particularly the Women and Children Protection Desk officers), and Municipal Social Welfare and Development Office (MSWDO) personnel. The focus of the interviews was on current issues in VAWC reporting, such as delays in reporting, lack of centralized monitoring, and difficulties in communication between residents and authorities.<\/p>\n<p>Additionally, a Work Breakdown Structure (WBS) was created to organize tasks and ensure systematic progress throughout the development process, as shown in Figure 2.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"768\" loading=\"lazy\" src=\"media1/m002.jpg\" width=\"1376\"/><\/figure>\n<p class=\"caption\"><em>Figure 2. Work Breakdown Structure<\/em><\/p>\n<h3 id=\"phase-two-analysis\">Phase Two: Analysis<\/h3>\n<p>The information gathered was analyzed to determine system requirements and define the scope and objectives of the system. This includes identifying the need for structured VAWC incident reporting, report validation through barangay officials, records retrieval, hotline contact access, and a chatbot assistant named Lumi that communicates in Kinaray-a, Tagalog, and English to guide users in submitting reports.<\/p>\n<h3 id=\"phase-three-design\">Phase Three: Design<\/h3>\n<p>In the Design phase, based on the analysis, high-fidelity prototypes were created using Figma. These designs focused on the layout, navigation, and overall functionality of the system to ensure a clear, organized, and user-friendly interface.<\/p>\n<p>The prototype includes the splash page, login and registration page, homepage, report page, Lumi AI chatbot page, and admin dashboard for monitoring and managing reports.<\/p>\n<p>In addition, the database was designed to store user information, incident reports, location data, and system logs. System workflows illustrated the flow of data from users submitting reports to administrators processing and responding to incidents.<\/p>\n<h3 id=\"phase-four-coding\">Phase Four: Coding<\/h3>\n<p>We developed the KASANGGA mobile application in Android Studio using Kotlin and Java, and the web-based admin dashboard in Visual Studio Code using HTML, CSS, JavaScript, and PHP. MySQL serves as the database of both platforms, so the user accounts and incident reports saved by the mobile application are the same records that the admin dashboard reads and updates. Following the Agile methodology, we built the system in iterations, each focusing on a specific set of features such as user authentication, incident reporting, and the Lumi AI chatbot. The steps we followed in building the mobile application and the web-based admin dashboard are presented in the following sections.<\/p>\n<p><strong>Source Code Structure.<\/strong> To make the code and files of the system easy to locate, we organized the source code of the mobile application and the web-based admin dashboard into folders. Figure 3 shows the source code structure of the KASANGGA mobile application. All the Kotlin source files are stored in app/src/main/java/com/example/kasangga, where each page of the application has its own file. The XML layouts of the pages are stored in app/src/main/res/layout, while the icons, images, colors, and text used by the application are stored in the other folders under res. The libraries used by the application are listed in app/build.gradle.kts.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1680\" loading=\"lazy\" src=\"media1/m003.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\"><em>Figure 3. Source Code Structure of the KASANGGA Mobile Application<\/em><\/p>\n<p>Figure 4 shows the source code structure of the web-based admin dashboard. The ADMINWEBDASH folder is placed inside the htdocs folder of XAMPP so that Apache can run it. The HTML files contain the login and dashboard pages of the Admin and Super Admin. The api folder contains the PHP files that the mobile application and the dashboard use to save and read data, such as reports.php for the VAWC reports and users.php for the accounts of the application users. The config.php file holds the database connection settings, while schema.sql contains the tables of the kasangga_admin database.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"943\" loading=\"lazy\" src=\"media1/m004.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\"><em>Figure 4. Source Code Structure of the Web-Based Admin Dashboard<\/em><\/p>\n<p><strong>Setting Up the Development Environment.<\/strong> In this step, we set up Android Studio, the official development environment that we used to write, build, and test the KASANGGA mobile application. Figure 5 shows the welcome window of Android Studio, where we create, open, and manage the projects of the mobile application.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"641\" loading=\"lazy\" src=\"media1/m005.jpg\" width=\"785\"/><\/figure>\n<p class=\"caption\"><em>Figure 5. Setting Up the Mobile Development Environment<\/em><\/p>\n<p><strong>Creating a New Project.<\/strong> In this step, we created a new project in Android Studio by selecting the Empty Views Activity template. After which, we entered KASANGGA as the project name, set the package name to com.example.kasangga, chose the save location and the minimum Software Development Kit (SDK) version, and selected Kotlin as the main programming language, as shown in Figure 6.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"614\" loading=\"lazy\" src=\"media1/m006.jpg\" width=\"901\"/><\/figure>\n<p class=\"caption\"><em>Figure 6. Creating a New Project<\/em><\/p>\n<p><strong>Configuring the Project Dependencies.<\/strong> In this step, we configured the build.gradle.kts file of the application module. Figure 7 shows lines 43 to 60 of the file. Lines 43 to 46 set the Java version used to compile the project to Java 11. Lines 49 to 60 list the libraries that the application needs: the AndroidX core, AppCompat, Material, ConstraintLayout, and Activity libraries for building the pages (lines 50 and 52 to 55), the AndroidX SplashScreen library for the splash screen (line 51), and OkHttp for sending requests to the web server (line 56). Lines 57 to 59 add the libraries used for testing.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"808\" loading=\"lazy\" src=\"media1/m007.jpg\" width=\"1105\"/><\/figure>\n<p class=\"caption\"><em>Figure 7. Code Snippet of the Project Dependencies<\/em><\/p>\n<p><strong>Coding the User Interface Layouts.<\/strong> In this step, we coded the XML layout of each page of the application based on the prototypes that we created in Figma during the Design phase. Figure 8 shows the phone number field of the Login page in activity_main.xml. Lines 80 to 87 create a horizontal LinearLayout with a rounded background (input_field_bg) that holds the field. Lines 89 to 93 add the phone icon tinted in the teal color of KASANGGA, while lines 95 to 106 add the EditText where the user types the phone number. The id edtPhoneNumber (line 96) lets MainActivity read the entered number, and the phone input type (line 100) opens the number keypad of the phone.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1288\" loading=\"lazy\" src=\"media1/m008.jpg\" width=\"1273\"/><\/figure>\n<p class=\"caption\"><em>Figure 8. Code Snippet of the User Interface Layout<\/em><\/p>\n<p><strong>Coding the Connection to the Database Server.<\/strong> In this step, we coded the AccountApiClient class, which connects the mobile application to the MySQL database through the PHP files of the web server. Figure 9 shows its post function. Line 76 converts the account details into JSON, and lines 77 to 80 build a POST request to the users.php file. Line 82 sends the request in the background using OkHttp. If the server cannot be reached, lines 83 to 87 show a message telling the user to make sure that XAMPP is running. When the server replies, lines 89 to 108 read the JSON response: if it is successful, lines 96 to 101 create an Account object with the full name, barangay, and phone number of the user; otherwise, lines 103 to 105 show the error message sent by the server.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1328\" loading=\"lazy\" src=\"media1/m009.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\"><em>Figure 9. Code Snippet of the Connection to the Database Server<\/em><\/p>\n<p><strong>Coding the User Authentication Feature.<\/strong> In this step, we coded the login of the user in MainActivity. Figure 10 shows the code that runs when the Login button is tapped. Lines 34 and 35 read the phone number and password entered by the user. Lines 37 to 45 check if either field is empty and show a reminder if it is. Lines 49 to 51 disable the button and change its label to <em>Please wait...<\/em> while the account is being checked. Line 53 sends the phone number and password to the server through AccountApiClient. If the account is correct, lines 54 to 61 save the session on the device and open the Home page; if not, lines 63 to 67 enable the button again and show the error message.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1490\" loading=\"lazy\" src=\"media1/m010.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\"><em>Figure 10. Code Snippet of the User Authentication Feature<\/em><\/p>\n<p><strong>Coding the Incident Reporting Feature.<\/strong> In this step, we coded the submitReport function of ReportActivity, which runs when the user submits a VAWC report. Figure 11 shows the function. Lines 138 and 139 disable the Submit button to prevent duplicate reports. Lines 142 and 143 copy the attached photos or videos into the storage of the application. Lines 145 to 153 save the report on the device together with the incident type, barangay, description, name and phone number of the reporter, and the attachments. After which, lines 163 to 179 send the report to the database of the admin dashboard and show whether the sync was successful. Lines 181 to 186 tell the user the report number and close the page.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"2143\" loading=\"lazy\" src=\"media1/m011.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\"><em>Figure 11. Code Snippet of the Incident Reporting Feature<\/em><\/p>\n<p><strong>Coding the Lumi AI Chatbot Feature.<\/strong> In this step, we coded the sendMessage function of GroqClient, which sends the message of the user to Lumi, the AI chatbot of KASANGGA. Figure 12 shows the function. Lines 118 to 125 check if the Groq API key is set. Lines 127 to 135 build the conversation, starting with the instructions of Lumi (SYSTEM_PROMPT) followed by the earlier messages of the user and Lumi. Lines 137 to 141 set the model, the conversation, and the length of the reply, and lines 143 to 148 send the request to the Groq API. Lines 151 to 153 handle a failed connection, lines 158 to 169 handle an error reply, and lines 170 to 176 read the reply of Lumi and show it in the chat page.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"2400\" loading=\"lazy\" src=\"media1/m012.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\"><em>Figure 12. Code Snippet of the Lumi AI Chatbot Feature<\/em><\/p>\n<p><strong>Coding the Splash Screen.<\/strong> In this step, we coded SplashActivity, the first page displayed when the application is opened. Figure 13 shows its onCreate and fadeInLogo functions. Line 42 installs the AndroidX splash screen so that the teal background appears right away, and line 44 loads the activity_splash layout. Lines 46 to 48 find the logo and the brand text, which starts empty. Line 51 waits for a moment before calling fadeInLogo. Lines 55 to 64 fade in and enlarge the logo to its full size, and line 62 then starts typing the name <em>KASANGGA<\/em> one letter at a time. When the animation ends, the application opens the Login page, or the Home page if the user is already logged in.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1008\" loading=\"lazy\" src=\"media1/m013.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\">Figure 13. Code Snippet of the Splash Screen<\/p>\n<h3 id=\"web-based-admin-dashboard-development\">Web-Based Admin Dashboard Development<\/h3>\n<p><strong>Setting Up the Development Environment.<\/strong> In this step, we set up Visual Studio Code, the code editor that we used to write and manage the HTML, CSS, JavaScript, and PHP files of the web-based admin dashboard, as shown in Figure 14.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"718\" loading=\"lazy\" src=\"media1/m014.jpg\" width=\"1366\"/><\/figure>\n<p class=\"caption\">Figure 14. Setting Up the Web Development Environment<\/p>\n<p><strong>Creating the Project Folder Structure.<\/strong> In this step, we created the folder structure of the admin dashboard, which consists of the HTML pages of the dashboard, the api folder for the PHP files, and the configuration files. This organization allows us to manage the files of the dashboard as new features are added in each iteration, as shown in Figure 15.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"718\" loading=\"lazy\" src=\"media1/m015.jpg\" width=\"1366\"/><\/figure>\n<p class=\"caption\"><em>Figure 15. Creating the Project Folder Structure<\/em><\/p>\n<p><strong>Running the Local Server Using XAMPP.<\/strong> Before opening and testing the admin dashboard, we opened the XAMPP Control Panel and clicked the Start button of the Apache and MySQL modules. Apache serves as the web server that runs the PHP files of the dashboard, while MySQL runs the database where the accounts and reports are stored. Once both modules turn green, the dashboard can be opened in the web browser through http://localhost/ADMINWEBDASH, and phpMyAdmin can be used to manage the database. XAMPP stays running so that the mobile application can also send and receive data through the API, as shown in Figure 16.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"540\" loading=\"lazy\" src=\"media1/m016.jpg\" width=\"680\"/><\/figure>\n<p class=\"caption\"><em>Figure 16. Running the Local Server Using XAMPP<\/em><\/p>\n<p><strong>Creating the MySQL Database.<\/strong> In this step, we used phpMyAdmin to create the kasangga_admin database and its tables, including the tables for the admin accounts, barangay contacts, incident reports, report notes, and registered users. After which, we set the primary and foreign keys that connect the tables, as shown in Figure 17.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"665\" loading=\"lazy\" src=\"media1/m017.jpg\" width=\"1361\"/><\/figure>\n<p class=\"caption\"><em>Figure 17. Creating the MySQL Database<\/em><\/p>\n<p><strong>Coding the Database Connection.<\/strong> In this step, we coded the config.php file, which holds the settings used by the PHP files to connect to the database. Figure 18 shows the file. Lines 2 to 6 describe its purpose, and lines 7 to 13 return the connection settings: the host (localhost), the name of the database (kasangga_admin), the username (root), the empty password of a new XAMPP installation, and the character set (utf8mb4). The same settings are used by the API that the mobile application connects to.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"534\" loading=\"lazy\" src=\"media1/m018.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\"><em>Figure 18. Code Snippet of the Database Connection<\/em><\/p>\n<p><strong>Coding the Admin Login and Dashboard Page.<\/strong> In this step, we coded the login of the Admin in admin_login.html. Figure 19 shows the doLogin function, which runs when the Login button is clicked. Lines 136 to 140 read the email and password entered by the admin. Lines 142 to 146 show a message if either field is empty. Lines 148 to 153 send the email and password to auth.php and make sure that the account has the admin role. If the login is successful, line 156 opens the admin dashboard, which shows the summary of the reports through charts; otherwise, lines 158 and 159 show the error message.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1168\" loading=\"lazy\" src=\"media1/m019.jpg\" width=\"1273\"/><\/figure>\n<p class=\"caption\"><em>Figure 19. Code Snippet of the Admin Login and Dashboard Page<\/em><\/p>\n<p><strong>Coding the Emergency Report and User Management Pages.<\/strong> In this step, we coded the pages where the administrators view, validate, and manage the submitted reports and the registered users. Figure 20 shows the update action of reports.php, which saves the changes made by the admin to a report. Lines 208 to 216 check if the report belongs to the barangay of the Barangay Admin, and if it does not, the update is stopped with the message “This report is not from your barangay.” Lines 217 to 221 accept only the valid statuses: Pending, Contacted, Validated, Rejected, and Resolved. Lines 223 and 224 save the new status of the report. Lines 226 to 235 record the change in the status history so that the resident can follow the progress of the report. Lines 237 to 243 save the note of the admin together with the email of the admin who wrote it, if there is one, and line 245 tells the dashboard that the update was successful.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1559\" loading=\"lazy\" src=\"media1/m020.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\">Figure 20. Code Snippet of the Emergency Report and User Management Pages<\/p>\n<p><strong>Coding the Manage Report Window.<\/strong> In this step, we coded the Manage Report window, which opens when the Barangay Admin clicks the Manage button of a report. Figure 21 shows part of its HTML code in admin_dashboard.html. Lines 663 to 666 show what happened, which is the description of the report. Lines 667 to 670 add the area for the photos and videos sent as evidence from the mobile application. Lines 671 to 684 add the call log, where lines 674 to 680 add the quick note buttons such as Called reporter, No answer, and Home visit done, line 681 adds the text box for a new note, and line 683 shows the notes already written. Lines 687 to 699 add the Update status box, where lines 690 to 696 keep the list of statuses, line 697 shows them as the Pending, Contacted, Validated, Rejected, and Resolved buttons, and line 698 shows the change from the current status to the new one.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1609\" loading=\"lazy\" src=\"media1/m021.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\">Figure 21. Code Snippet of the Manage Report Window<\/p>\n<p><strong>Coding the Overview Charts.<\/strong> In this step, we coded the charts on the Overview page of the Super Admin. Figure 22 shows the renderBarangayChart and renderTypeChart functions in super_admin_dashboard.html. Lines 1468 to 1470 count the reports of each barangay and keep the 10 barangays with the most reports. Lines 1472 to 1488 draw these counts as the Reports by barangay chart, which is a horizontal bar chart. Lines 1492 to 1496 count the reports of each incident type and give each type its own color. Lines 1498 to 1507 draw these counts as the Incidents by type chart, which is a doughnut chart with the legend at the bottom.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1609\" loading=\"lazy\" src=\"media1/m022.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\">Figure 22. Code Snippet of the Overview Charts<\/p>\n<p><strong>Coding the App Sign-ups per Month Chart.<\/strong> In this step, we coded the App sign-ups per month chart, which shows how many residents created a KASANGGA account each month. Figure 23 shows the renderSignupsChart and openUsersForMonth functions in admin_dashboard.html. Lines 1740 to 1742 list the last 12 months, and line 1743 counts the residents who signed up in each month. Lines 1745 to 1747 draw these counts as a bar chart. Line 1750 opens the residents of a month when its bar is clicked, and lines 1752 to 1755 show the month and the number of new sign-ups when the mouse is over a bar. Lines 1763 to 1767 open the Registered Users page and show only the residents who signed up in the chosen month.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1446\" loading=\"lazy\" src=\"media1/m023.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\">Figure 23. Code Snippet of the App Sign-ups per Month Chart<\/p>\n<p><strong>Coding the Barangays without a Barangay Admin and MSWDO Sections.<\/strong> In this step, we coded the parts of the Admin Accounts page that show the barangays without a Barangay Admin and the account of the MSWDO. Figure 24 shows part of the renderAdmins function and the __addAdminFor function in super_admin_dashboard.html. Line 2374 shows the cards of the Barangay Admins, and lines 2375 to 2377 show a message when no admin matches the search or filter. Line 2379 shows the card of the MSWDO in the MSWDO (Super Admin) section. Line 2381 hides the Barangays without a Barangay Admin section when every barangay already has an admin, while lines 2382 and 2383 add a button for each barangay that has no admin yet. Lines 2387 to 2392 open the Add Admin form with Barangay Admin already chosen and the clicked barangay already selected.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"858\" loading=\"lazy\" src=\"media1/m024.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\">Figure 24. Code Snippet of the Barangays without a Barangay Admin and MSWDO Sections<\/p>\n<p><strong>Running the Application on a Mobile Phone.<\/strong> In this step, we tested the mobile application on a real device. We connected an Android phone to the computer using a USB cable and turned on USB debugging in the Developer Options of the phone. After which, we selected the phone from the device list of Android Studio and clicked the Run button. Android Studio builds the application and installs it on the phone, where we checked each feature, as shown in Figure 25.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1100\" loading=\"lazy\" src=\"media1/m025.jpg\" width=\"825\"/><\/figure>\n<p class=\"caption\">Figure 25. Running the Application on a Mobile Phone<\/p>\n<p><strong>Building the APK File.<\/strong> In this step, we built the Android Package Kit (APK) file, which is the installer of the mobile application. In Android Studio, we selected Build, then Generate Signed App Bundle or APK, chose APK, signed it using the KASANGGA key store, and selected the release build variant. After which, Android Studio generated the app-release.apk file, which we renamed to KASANGGA.apk, as shown in Figure 26.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"161\" loading=\"lazy\" src=\"media1/m026.jpg\" width=\"376\"/><\/figure>\n<p class=\"caption\">Figure 26. Building the APK File<\/p>\n<p><strong>Sharing the APK through Google Drive.<\/strong> In this step, we uploaded the KASANGGA.apk file to Google Drive and set its sharing setting so that anyone with the link can view and download it. After which, we sent the link to the respondents and testers, who download the file and install it on their Android phones, as shown in Figure 27.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"422\" loading=\"lazy\" src=\"media1/m027.jpg\" width=\"512\"/><\/figure>\n<p class=\"caption\">Figure 27. Sharing the APK through Google Drive<\/p>\n<p><strong>Generating QR Code for Installing the Application.<\/strong> In this step, we generated a Quick Response (QR) code from the Google Drive link of the KASANGGA.apk file to make the installation easier. The respondents and testers scan the QR code using the camera of their Android phones to open the download page and install the application, as shown in Figure 28.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1240\" loading=\"lazy\" src=\"media1/m028.jpg\" width=\"1060\"/><\/figure>\n<p class=\"caption\">Figure 28. Generating QR Code for Installing the Application<\/p>\n<p>We developed, integrated, and reviewed each feature of the mobile application and the web-based admin dashboard in iterations, following the Agile methodology, which allowed us to continuously refine KASANGGA based on the requirements and feedback gathered throughout the development process.<\/p>\n<h3 id=\"phase-five-testing\">Phase Five: Testing<\/h3>\n<p>The system underwent usability testing to evaluate its overall ease of use, accessibility, and user satisfaction. This type of testing focuses on how effectively users can interact with the KASANGGA system’s features, including incident reporting, the barangay contacts directory, the Lumi AI chatbot interface, and the Games Hub. Selected users were asked to use the system and provide feedback based on their experience.<\/p>\n<p>The results of the usability testing were collected, analyzed, and used to identify areas for improvement. Necessary revisions and enhancements were implemented to ensure that the system met the needs of its users and provided a smooth and efficient user experience.<\/p>\n<h3 id=\"phase-six-delivery-of-partially-incremented-soft\">Phase Six: Delivery of Partially Incremented Software<\/h3>\n<p>Throughout development, partially completed versions of the KASANGGA system were presented to selected users, such as barangay officials and a few resident volunteers, at the end of each development cycle. Each increment introduced newly completed features, including incident reporting and related functionality.<\/p>\n<p>Users were guided through each partial version, and their initial impressions were gathered to confirm that the system aligned with real community needs before proceeding to the next development cycle.<\/p>\n<p>Issues identified during each increment were noted and addressed in the following development cycle, allowing the system to improve progressively before formal usability evaluation.<\/p>\n<h3 id=\"phase-seven-feedback-from-user\">Phase Seven: Feedback from User<\/h3>\n<p>After each partial increment was presented, feedback and insights were collected from users regarding the delivered features, with particular emphasis on usability, functionality, and ease of use. Selected users provided their responses through surveys or questionnaires based on their actual interaction with the system.<\/p>\n<p>All gathered feedback was reviewed and prioritized based on its relevance and importance to the system’s objectives, helping identify strengths and areas that required improvement.<\/p>\n<p>Necessary revisions and enhancements were then implemented to improve subsequent increments. This phase supported continuous development and ensured that the KASANGGA system evolved according to user needs, in alignment with Agile principles.<\/p>\n<h2 id=\"locale-of-the-study\">Locale of the Study<\/h2>\n<p>The study was conducted in San Enrique, Iloilo, a municipality located in the province of Iloilo. This area was selected as the locale of the study due to its community setting, where residents may benefit from an accessible and efficient emergency reporting system like KASANGGA.<\/p>\n<p>San Enrique consists of several barangays with varying levels of access to emergency services, making it a suitable location for evaluating the effectiveness and usability of the proposed system. The study involved selected residents and potential users within the community to assess how the system performed in a real-world environment.<\/p>\n<h2 id=\"sampling-technique\">Sampling Technique<\/h2>\n<p>The study used a combination of purposive sampling and simple random sampling. All 28 barangays of San Enrique, Iloilo were included in the study. In each barangay, two (2) barangay officials, namely the barangay captain and the Women and Children Protection Desk (VAWC) officer, were selected through purposive sampling since they are directly responsible for receiving and responding to VAWC reports and are the intended Barangay Admins of the system (Etikan, Musa, &amp; Alkassim, 2016). Purposive sampling was also used to select one (1) personnel of the Municipal Social Welfare and Development Office (MSWDO), who serves as the Super Admin of the system. For the residents, three (3) respondents were chosen from each barangay through simple random sampling, giving every resident an equal chance of being selected.<\/p>\n<h2 id=\"respondents-of-the-study\">Respondents of the study<\/h2>\n<p>The respondents of the study were composed of three groups with a total of one hundred forty-one (141) respondents. The first group consisted of eighty-four (84) residents of San Enrique, Iloilo, three (3) from each of the 28 barangays, who were potential users of the KASANGGA mobile application, including students, adults, and community members who can use mobile applications. The second group consisted of fifty-six (56) barangay officials, two (2) from each barangay, namely the barangay captain and the Women and Children Protection Desk (VAWC) officer, who will serve as the Barangay Admins of the web-based admin dashboard. The third group consisted of one (1) personnel of the Municipal Social Welfare and Development Office (MSWDO), who will serve as the Super Admin of the system. The distribution of the respondents is shown in Table 2.<\/p>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Respondents<\/strong><\/th>\n<th><strong>Per Barangay<\/strong><\/th>\n<th><strong>No. of Barangays<\/strong><\/th>\n<th><strong>Total<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Residents<\/td>\n<td>3<\/td>\n<td>28<\/td>\n<td>84<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Barangay Admins (Barangay Captain and VAWC Desk Officer)<\/td>\n<td>2<\/td>\n<td>28<\/td>\n<td>56<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Super Admin (MSWDO Personnel)<\/td>\n<td>–<\/td>\n<td>–<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Total<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><strong>141<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p class=\"caption\">Table 2. Distribution of Respondents<\/p>\n<p>The barangay officials and the MSWDO personnel were selected through purposive sampling because of their specific roles in handling VAWC cases, while the resident respondents were selected through simple random sampling so that every barangay of the municipality was equally represented.<\/p>\n<p>In each barangay, the three (3) resident respondents were chosen randomly to ensure fairness and an equal chance of participation. All selected respondents were asked to use the KASANGGA system and evaluate its usability through a structured questionnaire based on the System Usability Scale (SUS).<\/p>\n<h2 id=\"research-instrument\">Research Instrument<\/h2>\n<p>The evaluation of the KASANGGA system utilized a structured questionnaire based on the System Usability Scale (SUS), which is a widely accepted instrument for measuring system usability. The instrument is designed to assess the users’ overall experience after interacting with the system, particularly in terms of ease of use and user satisfaction.<\/p>\n<p><img alt=\"\" height=\"269\" loading=\"lazy\" src=\"media1/m029.jpg\" width=\"595\"/>The questionnaire consists of ten (10) items rated using a 5-point Likert scale ranging from Strongly Disagree (1) to Strongly Agree (5). The SUS instrument provides a standardized approach for evaluating usability based on user responses after actual system usage. As shown in table 3.<\/p>\n<p class=\"caption\"><em>Table 3. System’s Usability Rating Scale<\/em><\/p>\n<h2 id=\"data-gathering-procedure\">Data Gathering Procedure<\/h2>\n<p>The data gathering procedure of the study followed a step-by-step process to ensure accurate results in evaluating the usability of the KASANGGA system.<\/p>\n<p>First, permission was asked from the proper authorities of San Enrique, Iloilo before conducting the study. After approval, the barangay captain and the VAWC officer of each of the 28 barangays, together with one (1) MSWDO personnel, were selected through purposive sampling, while three (3) residents from each barangay were selected through simple random sampling.<\/p>\n<p>Next, the selected respondents were given a short orientation about the KASANGGA system. They were introduced to its main features, such as emergency reporting and Lumi AI chatbot assistance. After that, the respondents were allowed to use the system in a controlled or simulated emergency.<\/p>\n<p>After using the system, the respondents answered the System Usability Scale (SUS) questionnaire to share their experience. The questionnaire was given right after they used the system, so their answers were still fresh and accurate.<\/p>\n<p>The completed questionnaires were then gathered, checked, and recorded for analysis. The responses were scored using the standard SUS method to get the overall usability score of the system.<\/p>\n<p>Finally, the results were analyzed and interpreted to determine the usability level of the KASANGGA system. The findings were also used to identify areas that could still be improved.<\/p>\n<h2 id=\"data-analysis-procedure\">Data Analysis Procedure<\/h2>\n<p>The data gathered from the System Usability Scale (SUS) questionnaire was analyzed using the standardized SUS scoring procedure to determine the usability of the KASANGGA system.<\/p>\n<p>Each of the ten (10) SUS items was scored based on the standard procedure. For odd-numbered items, the score is computed by subtracting 1 from the response. For even-numbered items, the score is computed by subtracting the response from 5. The adjusted scores are then summed.<\/p>\n<p>The total sum was multiplied by 2.5 to obtain the final System Usability Scale score, which ranges from 0 to 100.<\/p>\n<h4 id=\"sus-formula\">SUS Formula:<\/h4>\n<p>SUS Score = (X + Y) × 2.5<\/p>\n<p>Where:<br/>\nX = the points for odd-numbered questions minus 5<br/>\nY = 25 minus the points for even-numbered questions<\/p>\n<p>The resulting SUS score was interpreted using standard SUS interpretation guidelines, where higher scores indicate better system usability. A score of 68 is considered the average benchmark for usability, while scores above 68 indicate good usability of the system.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"573\" loading=\"lazy\" src=\"media1/m030.jpg\" width=\"593\"/><\/figure>\n<p class=\"caption\"><em>Table 4. System Usability Scale<\/em><\/p>\n"}, {"id": "ch4", "label": "Chapter IV", "subtitle": "Analyses, Presentation and Interpretation of Data", "sections": [{"id": "mobile-application", "title": "Mobile Application", "level": 2}, {"id": "web-based-admin-dashboard", "title": "Web-Based Admin Dashboard", "level": 2}], "html": "\n\n<p>This chapter presents the study’s design, results, and discussion of KASANGGA: A Mobile-Based Violence Against Women and Children (VAWC) Reporting and Assistance System with a Web-Based Admin Dashboard.<\/p>\n<p>This study aimed to develop and evaluate KASANGGA: A Mobile-Based Violence Against Women and Children (VAWC) Reporting and Assistance System with a Web-Based Admin Dashboard. The system was evaluated by eighty-four (84) residents, three (3) from each of the 28 barangays of San Enrique, Iloilo, who were chosen through simple random sampling, and by fifty-six (56) barangay captains and Women and Children Protection Desk officers and one (1) Municipal Social Welfare and Development Office (MSWDO) personnel, who were chosen through purposive sampling.<\/p>\n<p><strong>The Developed KASANGGA: A Mobile-Based Violence Against Women and Children (VAWC) Reporting and Assistance System with a Web-Based Admin Dashboard<\/strong><\/p>\n<p>The developed KASANGGA system was designed to provide residents of San Enrique, Iloilo with a safe, accessible, and confidential platform for reporting Violence Against Women and Children (VAWC) incidents. The system addressed the community’s difficulties in reporting cases on time, accessing emergency hotlines, and receiving guidance when experiencing or witnessing VAWC-related situations.<\/p>\n<p>KASANGGA provided secure incident reporting, a directory of barangay officials’ contact numbers, informational content on VAWC-related laws, Lumi, an AI-assisted chatbot that communicates in Kinaray-a, Tagalog, and English to guide users in submitting reports, and a Games Hub with a trivia quiz and a picture-word puzzle to help users learn about RA 9262 and VAWC awareness.<\/p>\n<p>The system provided separate interfaces and permissions for residents and administrators. Residents accessed the mobile application to submit reports, view barangay officials’ contact numbers, review VAWC-related laws, communicate with Lumi, and play the Games Hub’s educational quiz and picture-word puzzle, while barangay officials and MSWDO personnel accessed the web-based admin dashboard to validate reports, manage user accounts, and respond to VAWC cases. Role-based access controls were implemented to ensure that users could only access the functions permitted for their assigned roles.<\/p>\n<h2 id=\"mobile-application\">Mobile Application<\/h2>\n<p><strong>The Splash Screen Interface.<\/strong> The Splash Screen Interface, shown in Figure 29, is the first page that appears when the KASANGGA application is opened. It displays the KASANGGA logo and name on a teal background while the application loads. The logo fades in and the name <em>KASANGGA<\/em> appears letter by letter, after which the application automatically opens the Login Interface, or goes straight to the Homepage if the user is already logged in on the device.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"2048\" loading=\"lazy\" src=\"media1/m031.jpg\" width=\"899\"/><\/figure>\n<p class=\"caption\"><em>Figure 29. The Splash Screen Interface<\/em><\/p>\n<p><strong>The Login Interface.<\/strong> The Login Interface, shown in Figure 30, provides secure access to KASANGGA for registered residents. Users enter their registered mobile number and password in the provided fields. The eye icon inside the password field allows users to show or hide their entered password. A <em>Forgot Password?<\/em> link is also displayed, though its account-recovery flow has not yet been implemented. After selecting the <em>Login<\/em> button, the system verifies the entered credentials and redirects the user to the Homepage. The <em>Sign Up<\/em> link is provided for new users who do not yet have an account.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"2050\" loading=\"lazy\" src=\"media1/m032.jpg\" width=\"900\"/><\/figure>\n<p class=\"caption\"><em>Figure 30. The Login Interface<\/em><\/p>\n<p><strong>The Registration Interface.<\/strong> The Registration Interface, shown in Figure 31, allows new users to create a KASANGGA account. The form requires the resident’s full name, mobile number, barangay (selected from a dropdown list of the 28 barangays of San Enrique, Iloilo), and password with confirmation. After selecting the <em>Create Account<\/em> button, the system validates the information, checks that both passwords match, and creates the account. The <em>Login<\/em> link allows users with an existing account to return to the Login Interface.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"2050\" loading=\"lazy\" src=\"media1/m033.jpg\" width=\"900\"/><\/figure>\n<p class=\"caption\"><em>Figure 31. The Registration Interface<\/em><\/p>\n<p><strong>The Homepage Interface.<\/strong> The Homepage Interface, shown in Figure 32, is the first page users see after logging in. The top of the page greets the user by name and shows the barangay they registered under. Below it is a banner with the message <em>You are not alone, we are here to help you.<\/em> The <em>What is KASANGGA?<\/em> card gives a short explanation of the application, and the <em>Learn More<\/em> link opens more details about it. The <em>Report a VAWC Incident<\/em> card contains the <em>REPORT AN INCIDENT<\/em> button, which opens the report form, together with a reminder that every report is handled with confidentiality. The round robot button at the lower right opens the chat with Lumi, while the <em>Learn &amp; Play<\/em> card further down the page opens the Games Hub. The bottom navigation bar lets users move between the Home, Contacts, Reports, Laws, and Profile tabs.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media1/m034.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 32. The Homepage Interface<\/em><\/p>\n<p><strong>The Submit a Report Interface.<\/strong> The Submit a Report Interface, shown in Figure 33, opens when users tap the <em>REPORT AN INCIDENT<\/em> button on the Homepage. A note at the top reminds users that their report is confidential and that, if they are in immediate danger, they should use the Contacts tab to call for help first. Users then choose the <em>Type of Incident<\/em>, such as Physical Abuse, and the <em>Barangay<\/em> where it happened. The <em>Add Photo or Video<\/em> button lets users attach up to five photos or short videos as evidence, although this part is optional. In the <em>Description<\/em> field, users write what happened in their own words. Once the <em>Submit Report<\/em> button is tapped, the report is sent to the authorized barangay and MSWDO admins and is added to the user’s Reports tab with a Pending status.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1284\" loading=\"lazy\" src=\"media1/m035.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 33. The Submit a Report Interface<\/em><\/p>\n<p><strong>The Contacts Interface.<\/strong> The Contacts Interface, shown in Figure 34, lists the contact numbers of the barangay officials in San Enrique, Iloilo. The <em>Barangay Officials (28)<\/em> heading shows that all 28 barangays are included. Each barangay has its own card showing the name and mobile number of its Barangay Captain and its VAWC Desk Officer. The phone button beside each number lets users call the official right away, while the message button opens a text message to the same number. The search bar at the top helps users quickly find a barangay, captain, or VAWC officer by typing a name.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media1/m036.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 34. The Contacts Interface<\/em><\/p>\n<p><strong>The Reports Interface.<\/strong> The Reports Interface, shown in Figure 35, lets users keep track of the reports they have submitted. The three boxes at the top show the <em>Total<\/em> number of reports, how many are still <em>Pending<\/em>, and how many have been <em>Resolved<\/em>. Below these are a search bar and filter buttons for All Reports, Pending, Contacted, Validated, Rejected, and Resolved, so users can view their reports by status. Each report card shows the report number, the type of incident, the date and time it was submitted, the barangay, and its current status. The <em>View Full report<\/em> link opens the complete details of the report. In Figure 35, the user has one Physical Abuse report that is still waiting for action from the barangay.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media1/m037.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 35. The Reports Interface<\/em><\/p>\n<p><strong>The Laws Interface.<\/strong> The Laws Interface, shown in Figure 36, gives users a list of Philippine laws that protect women and children. These include the Anti-VAWC Act (RA 9262), the Child Abuse Protection law (RA 7610), the Safe Spaces Act (RA 11313), the Anti-Trafficking in Persons Act (RA 9208, as expanded by RA 11862), the Anti-Rape Law of 1997 (RA 8353), the Magna Carta of Women (RA 9710), the Anti-Photo and Video Voyeurism Act (RA 9995), the Cybercrime Prevention Act (RA 10175), the Juvenile Justice and Welfare Act (RA 9344, as amended by RA 10630), the Prohibition of Child Marriage Act (RA 11596), and the Anti-Child Pornography Act (RA 9775). Users can look for a specific law using the search bar, or tap the <em>All<\/em>, <em>Women<\/em>, and <em>Child<\/em> buttons to show only the laws for that group. The <em>EN<\/em> and <em>Filipino<\/em> buttons let users choose whether the simplified explanations are shown in English or Filipino. Each law card shows a picture, the Republic Act number, the name of the law, its type, and a short explanation written in simple words. Tapping <em>Read More<\/em> opens the full details of the law.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media1/m038.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 36. The Laws Interface<\/em><\/p>\n<p><strong>The Law Details Interface.<\/strong> The Law Details Interface, shown in Figure 37, appears when users tap <em>Read More<\/em> on a law card. Using the Anti-VAWC Act (RA 9262) as an example, the page shows the picture, type, Republic Act number, and name of the law, followed by a simple explanation of who the law protects and what it covers. The <em>Example<\/em> box describes a real-life situation so users can see how the law applies to them. In this case, a husband who shouts at his wife, calls her worthless, and takes her salary is already committing emotional and economic abuse, even if he has never hit her. The <em>Full Legal Description<\/em> at the bottom gives the more formal meaning of the law. The <em>CLOSE<\/em> button brings users back to the list of laws.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1470\" loading=\"lazy\" src=\"media1/m039.jpg\" width=\"640\"/><\/figure>\n<p class=\"caption\"><em>Figure 37. The Law Details Interface<\/em><\/p>\n<p><strong>The Lumi AI Chatbot Interface.<\/strong> The Lumi AI Chatbot Interface, shown in Figure 38, is where users can talk with Lumi, the system’s AI-assisted chatbot. Lumi starts the conversation by greeting the user by name in Kinaray-a, <em>Kumusta, Kizaih! Ano ang mabulig ko sa imo?<\/em> (Hello, Kizaih! How can I help you?). Lumi can also reply in Tagalog or English depending on the language the user types in. In the example, the user sent <em>Hi,<\/em> so Lumi answered in English. Users type their message in the <em>Type a message<\/em> box and tap the send button. Lumi guides users in submitting reports, explains the reporting process, and answers common questions about VAWC.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"948\" loading=\"lazy\" src=\"media1/m040.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 38. The Lumi AI Chatbot Interface<\/em><\/p>\n<p><strong>The Profile Interface.<\/strong> The Profile Interface, shown in Figure 39, shows the account details of the user. The top part displays the user’s initials, full name, and role as a resident of their barangay. Under <em>Account Information<\/em>, users can view and edit their <em>Full Name<\/em>, <em>Address/Barangay<\/em>, and <em>Contact Number<\/em>. Tapping the <em>Save Changes<\/em> button updates their information, while the <em>Logout Account<\/em> button signs them out of the application.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media1/m041.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 39. The Profile Interface<\/em><\/p>\n<p><strong>The Games Hub Interface.<\/strong> The Games Hub Interface, shown in Figure 40, opens from the <em>Learn &amp; Play<\/em> card on the Home tab. It lets users test what they know about RA 9262 and KASANGGA through two games. The <em>Trivia Quiz<\/em> is a timed multiple-choice game where users answer before time runs out, build a streak of correct answers, and earn points. The <em>4 Pics, 1 Word<\/em> game shows four pictures and asks users to guess the one word that connects them. Users simply tap a game card to start playing.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"704\" loading=\"lazy\" src=\"media1/m042.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 40. The Games Hub Interface<\/em><\/p>\n<p><strong>The VAWC Awareness Quiz Interface.<\/strong> The VAWC Awareness Quiz Interface, shown in Figure 41, is the page of the Trivia Quiz while it is being played. The upper part shows the current question number out of ten and the user’s score. The bar below it serves as the timer and becomes shorter as time runs out. Each question has four choices, and users tap the answer they think is correct. The game then shows right away whether the answer is right or wrong. In Figure 41, the question asks who can see a submitted VAWC report, and the correct answer is <em>Only authorized barangay/municipal admins handling VAWC cases.<\/em> Through questions like this, users learn about their rights under RA 9262 and how KASANGGA keeps their reports private.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1084\" loading=\"lazy\" src=\"media1/m043.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 41. The VAWC Awareness Quiz Interface<\/em><\/p>\n<p><strong>The 4 Pics, 1 Word Interface.<\/strong> The 4 Pics, 1 Word Interface, shown in Figure 42, is the page of the picture-word puzzle game. The number at the upper right shows the current puzzle out of eight. Each puzzle has a category that serves as a clue, and in this example the category is <em>Why your report stays confidential.<\/em> The four pictures, a padlock, a shield with a check mark, two people, and a weighing scale, all point to one word. The empty boxes show how many letters the answer has, and users fill them in by tapping the letters below. Here, the answer is PRIVACY. If users get stuck, they can tap the <em>HINT<\/em> button to get help.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1104\" loading=\"lazy\" src=\"media1/m044.jpg\" width=\"720\"/><\/figure>\n<p class=\"caption\"><em>Figure 42. The 4 Pics, 1 Word Interface<\/em><\/p>\n<h2 id=\"web-based-admin-dashboard\">Web-Based Admin Dashboard<\/h2>\n<p>KASANGGA's web-based admin dashboard provides two separate portals with different permissions. Barangay Admins, such as the barangay captain or the VAWC desk officer, sign in through their own portal. Each Barangay Admin is assigned to one barangay and only sees the reports, residents, and numbers of that barangay. They handle the reports by calling the reporter, updating the status, and writing call notes, but they cannot delete reports or manage admin accounts. The Super Admin, who is the MSWDO, signs in through a separate portal that covers all 28 barangays of San Enrique. The Super Admin views reports read-only with an added option to permanently delete a report, edits the barangay hotline contacts, and manages the registered user accounts and the admin accounts.<\/p>\n<p><strong>The Admin Login Interface.<\/strong> The Admin Login Interface, shown in Figure 43, is the sign-in page for Barangay Admins, such as the barangay captain or the VAWC desk officer. The admin types the registered email address in the <em>Admin Email<\/em> field and the password in the <em>Password<\/em> field. The eye icon lets the admin show or hide the password while typing. After clicking <em>Sign In<\/em>, the system checks the account and opens the Admin Dashboard. The <em>Signing in as Super Admin?<\/em> link brings the user to the separate Super Admin login page. A short note at the bottom reminds new admins that their account must be created by the Super Admin.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m045.jpg\" width=\"1342\"/><\/figure>\n<p class=\"caption\"><em>Figure 43. The Admin Login Interface<\/em><\/p>\n<p><strong>The Super Admin Login Interface.<\/strong> The Super Admin Login Interface, shown in Figure 44, is the sign-in page for the Super Admin, who oversees all barangays at the municipal level through the MSWDO. It works the same way as the Admin Login, but it uses a purple design so the two portals are easy to tell apart. The Super Admin enters the registered email address and password, then clicks <em>Sign In<\/em> to open the Super Admin Dashboard. The <em>Signing in as Admin?<\/em> link goes back to the Admin Login page for users who opened the wrong portal.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m046.jpg\" width=\"1342\"/><\/figure>\n<p class=\"caption\"><em>Figure 44. The Super Admin Login Interface<\/em><\/p>\n<p><strong>The Analytics Interface.<\/strong> The Analytics Interface, shown in Figure 45, is the first page a Barangay Admin sees after signing in. It is labeled with the barangay of the admin, such as <em>Bantayan Brgy. Admin<\/em>, and all of its numbers only count the reports and residents of that barangay. The four boxes at the top show the <em>Total reports<\/em> with the number filed this month, the reports that <em>Need your action<\/em> because they are still waiting for a call or being verified, the <em>Resolved cases<\/em> with a bar showing the percentage resolved, and the <em>Registered residents<\/em> with the new sign-ups of the month. The <em>Case status<\/em> card shows how the reports are divided into Pending, Contacted, Validated, Rejected, and Resolved, and clicking a status opens the matching reports. The <em>Barangay<\/em> card shows if a report is still waiting for a call, if the hotline contacts are complete, the reports with photo or video evidence, and the residents who filed a report. Below these are the charts <em>Reports over time<\/em>, <em>Monthly reports<\/em>, and <em>Incidents by type<\/em>.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m047.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 45. The Analytics Interface<\/em><\/p>\n<p><strong>The App Sign-ups per Month Chart.<\/strong> The App Sign-ups per Month Chart, shown in Figure 46, is found at the bottom of the Analytics page. It shows how many residents of the admin's barangay created a KASANGGA account each month for the last 12 months. Clicking a bar shows the residents who signed up in that month.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"343\" loading=\"lazy\" src=\"media1/m048.jpg\" width=\"1047\"/><\/figure>\n<p class=\"caption\"><em>Figure 46. The App Sign-ups per Month Chart<\/em><\/p>\n<p><strong>The Overview Interface.<\/strong> The Overview Interface, shown in Figure 47, is the first page the Super Admin sees after signing in. It works like the Analytics page but covers all 28 barangays of San Enrique. The four boxes show the <em>Total reports<\/em>, the reports that <em>Need action<\/em>, the <em>Resolved cases<\/em>, and the <em>Registered residents<\/em>, followed by the <em>Case status<\/em> card. The <em>Coverage across San Enrique<\/em> card shows how many barangays already have a Barangay Admin, have residents using the app, have filed reports, and have complete hotline contacts. The <em>All barangays<\/em> dropdown at the upper right shows the numbers of one barangay only. Below these are the charts <em>Reports over time<\/em>, <em>Reports by barangay<\/em>, and <em>Incidents by type<\/em>.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m049.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 47. The Overview Interface<\/em><\/p>\n<p><strong>The Overview Charts.<\/strong> The Overview Charts, shown in Figure 48, are found below the boxes of the Overview page. <em>Reports over time<\/em> shows the number of reports sent each day for the most recent 30 days. <em>Reports by barangay<\/em> shows the barangays with the most reports, up to the top 10. <em>Incidents by type<\/em> shows how the reports are divided into Physical Abuse, Sexual Abuse, Economic Abuse, and Verbal or Emotional Abuse.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"341\" loading=\"lazy\" src=\"media1/m050.jpg\" width=\"1047\"/><\/figure>\n<p class=\"caption\"><em>Figure 48. The Overview Charts<\/em><\/p>\n<p><strong>The Barangay Summary Table.<\/strong> The Barangay Summary Table, shown in Figure 49, is found at the bottom of the Overview page. Each row shows a barangay, a colored bar of its reports by status, and its <em>Total<\/em> reports, the reports that <em>Need action<\/em>, the <em>Resolved<\/em> reports, the number of <em>Residents<\/em> using the app, and whether a <em>Brgy. Admin<\/em> is assigned. The Super Admin can search for a barangay, sort the rows by the most reports or the most reports needing action, and hide the barangays without reports. Clicking a row focuses the whole Overview on that barangay.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"404\" loading=\"lazy\" src=\"media1/m051.jpg\" width=\"1047\"/><\/figure>\n<p class=\"caption\"><em>Figure 49. The Barangay Summary Table<\/em><\/p>\n<p><strong>The Admin VAWC Reports Interface.<\/strong> The Admin VAWC Reports Interface, shown in Figure 50, lists the reports sent by the residents of the admin's barangay through the mobile application. Each report is shown as a card with a colored bar for its status, the type of incident, the report code, the first lines of the description, the reporter's name and phone number, and when it was sent. The status tabs at the top show how many reports are <em>Pending<\/em>, <em>Contacted<\/em>, <em>Validated<\/em>, <em>Rejected<\/em>, and <em>Resolved<\/em>, and clicking a tab shows only those reports. The admin can also search by reporter, phone number, type, code, or description, and sort the list from newest or oldest. Clicking <em>Manage<\/em> opens the report, while the <em>Export Reports<\/em> button downloads the reports.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m052.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 50. The Admin VAWC Reports Interface<\/em><\/p>\n<p><strong>The Manage Report Window.<\/strong> The Manage Report Window, shown in Figure 51, opens when a Barangay Admin clicks <em>Manage<\/em> on a report. The left side shows <em>What happened<\/em>, the <em>Evidence (photos / videos)<\/em>, and the <em>Call log / notes<\/em> with the notes already written. After calling the reporter, the admin can type a note or click a quick note such as <em>Called reporter<\/em> or <em>Home visit done<\/em>. The right side has the <em>Update status<\/em> buttons for Pending, Contacted, Validated, Rejected, and Resolved, with the current status marked <em>current<\/em>. Clicking <em>Save changes<\/em> saves the new status and note, and the new status also appears in the Reports tab of the resident's mobile application. <em>Print / Save PDF<\/em> prints the report, while <em>Cancel<\/em> closes the window without saving.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m053.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 51. The Manage Report Window<\/em><\/p>\n<p><strong>The Super Admin VAWC Reports Interface.<\/strong> The Super Admin VAWC Reports Interface, shown in Figure 52, shows the reports of all 28 barangays and is meant for monitoring. Each card has a tag with the name of its barangay, and the <em>All barangays<\/em> dropdown shows the reports of one barangay only. Instead of <em>Manage<\/em>, each report has a <em>View<\/em> button, because the calls and status updates are done by the Barangay Admins. The Super Admin can still use the status tabs, search the list, and download the reports using the <em>Export Reports<\/em> button.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m054.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 52. The Super Admin VAWC Reports Interface<\/em><\/p>\n<p><strong>The Report Details Window.<\/strong> The Report Details Window, shown in Figure 53, opens when the Super Admin clicks <em>View<\/em> on a report. The header shows the type of incident, its status, the report code, the barangay, and when it was sent. It shows the description, the evidence, the call notes written by the Barangay Admin, the reporter's details, and the <em>Case timeline<\/em>. The Super Admin can only read these details. The <em>Delete report<\/em> button is used only when a report needs to be removed for good, <em>Print / Save PDF<\/em> prints the report, and <em>Close<\/em> returns to the list.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m055.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 53. The Report Details Window<\/em><\/p>\n<p><strong>The Export Reports Window.<\/strong> The Export Reports Window, shown in Figure 54, appears when the <em>Export Reports<\/em> button is clicked. The admin first chooses which reports to include, either the reports <em>Shown on the page<\/em> with the current filters or <em>All reports<\/em>. The admin then chooses the format. <em>Spreadsheet (Excel / CSV)<\/em> downloads the reports in rows and columns, while <em>Printable report (PDF)<\/em> opens a summary with totals and a signature block that can be printed or saved as a PDF.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m056.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 54. The Export Reports Window<\/em><\/p>\n<p><strong>The Admin Barangay Contacts Interface.<\/strong> The Admin Barangay Contacts Interface, shown in Figure 55, shows the hotline numbers that residents see in the Contacts tab of the mobile application. The <em>Your barangay<\/em> box at the top shows the name and number of the Punong Barangay and the VAWC Desk Officer of the admin's barangay, each with a <em>Copy<\/em> button. Below it, the contacts of the other barangays of San Enrique are listed for referrals, together with a search bar. Barangay Admins can only view these contacts, because only the Super Admin is allowed to change them.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m057.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 55. The Admin Barangay Contacts Interface<\/em><\/p>\n<p><strong>The Super Admin Barangay Contacts Interface.<\/strong> The Super Admin Barangay Contacts Interface, shown in Figure 56, shows the contacts of all 28 barangays. The <em>Contact coverage<\/em> box shows how many barangays have both numbers complete and how many still miss a number. The filters <em>All<\/em>, <em>Needs update<\/em>, and <em>Complete<\/em> and the search bar help the Super Admin find a barangay quickly. Each card shows the Captain and the VAWC officer of the barangay and when the contacts were last updated.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m058.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 56. The Super Admin Barangay Contacts Interface<\/em><\/p>\n<p><strong>The Edit Contact Form.<\/strong> The Edit Contact Form, shown in Figure 57, opens when the Super Admin clicks <em>Edit<\/em> on a barangay. The card turns into a form with the name and number of the Punong Barangay and the VAWC Desk Officer. When a barangay gets a new captain or VAWC desk officer, or a number changes, the Super Admin types the new information and clicks <em>Save<\/em>. The change also shows up in the Contacts tab of the mobile application.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m059.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 57. The Edit Contact Form<\/em><\/p>\n<p><strong>The Admin Registered Users Interface.<\/strong> The Admin Registered Users Interface, shown in Figure 58, lists the residents of the admin's barangay who created an account in the KASANGGA mobile application. Each resident is shown as a card with the name, phone number, the date joined, and how many reports the resident has filed. The admin can search by name or phone number, choose a month in <em>All months<\/em>, and sort the list. Barangay Admins can only view this list and cannot remove any account.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m060.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 58. The Admin Registered Users Interface<\/em><\/p>\n<p><strong>The Super Admin Registered Users Interface.<\/strong> The Super Admin Registered Users Interface, shown in Figure 59, shows the registered residents of all barangays, with a tag for the barangay of each resident and an <em>All barangays<\/em> filter. Each card has a <em>Delete account<\/em> button. Only the Super Admin can delete a user account, for example when an account is fake or was created by mistake.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m061.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 59. The Super Admin Registered Users Interface<\/em><\/p>\n<p><strong>The Admin Accounts Interface.<\/strong> The Admin Accounts Interface, shown in Figure 60, can only be opened by the Super Admin. Each Barangay Admin is shown as a card with the barangay it handles, such as <em>Bantayan Brgy. Admin<\/em>, its email address, and its status. The <em>Assigned barangay<\/em> dropdown sets or changes the barangay of the admin. The <em>Deactivate<\/em> button blocks an admin from signing in without deleting the account, so it can be turned back on later. The <em>+ Add Admin<\/em> button at the upper right is used to create a new account.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m062.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 60. The Admin Accounts Interface<\/em><\/p>\n<p><strong>The Barangays without a Barangay Admin and MSWDO Sections.<\/strong> The Barangays without a Barangay Admin and MSWDO Sections, shown in Figure 61, are found below the list of Barangay Admins on the Admin Accounts page. The <em>Barangays without a Barangay Admin<\/em> section lists the barangays that do not have an admin yet, so their reports can only be handled by the MSWDO for now. Clicking a barangay opens the form for creating its admin account. The <em>MSWDO (Super Admin)<\/em> section shows the account of the Super Admin with its email address and its status.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"430\" loading=\"lazy\" src=\"media1/m063.jpg\" width=\"1047\"/><\/figure>\n<p class=\"caption\"><em>Figure 61. The Barangays without a Barangay Admin and MSWDO Sections<\/em><\/p>\n<p><strong>The Add Admin Form.<\/strong> The Add Admin Form, shown in Figure 62, opens when the Super Admin clicks <em>+ Add Admin<\/em>. The Super Admin first chooses who the account is for, either a <em>Barangay Admin<\/em> or a <em>Super Admin<\/em>, and for a Barangay Admin also chooses the barangay. The Super Admin then enters the email address and a temporary password. Clicking <em>Create account<\/em> creates the account and adds it to the list, while <em>Cancel<\/em> closes the form without saving. This way, only people chosen by the Super Admin can access the dashboards.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"623\" loading=\"lazy\" src=\"media1/m064.jpg\" width=\"1312\"/><\/figure>\n<p class=\"caption\"><em>Figure 62. The Add Admin Form<\/em><\/p>\n"}, {"id": "refs", "label": "References", "subtitle": "", "sections": [], "html": "\n<p>Ali, F. Z., &amp; Ilyas, A. (2025). VS Code development study.<\/p>\n<p>Apache Friends. (n.d.). XAMPP. https://www.apachefriends.org<\/p>\n<p>Atlassian. (n.d.). <em>What is Agile?<\/em> <a href=\"https://www.atlassian.com/agile\">https://www.atlassian.com/agile<\/a><\/p>\n<p>Brooke, J. (1996). SUS: A “quick and dirty” usability scale. In P. W. Jordan, B. Thomas, I. McClelland, &amp; B. Weerdmeester (Eds.), <em>Usability evaluation in industry<\/em> (pp. 189–194). Taylor &amp; Francis.<\/p>\n<p>Callan, J., &amp; Petke, J. (2024). Android application improvement.<\/p>\n<p>Duckett, J. (2022). <em>HTML and CSS design<\/em>.<\/p>\n<p>Elmasri, R., &amp; Navathe, S. B. (2016). <em>Fundamentals of database systems<\/em> (7th ed.). Pearson.<\/p>\n<p>Etikan, I., Musa, S. A., &amp; Alkassim, R. S. (2016). Comparison of convenience sampling and purposive sampling. <em>American Journal of Theoretical and Applied Statistics, 5<\/em>(1), 1–4. <a href=\"https://doi.org/10.11648/j.ajtas.20160501.11\">https://doi.org/10.11648/j.ajtas.20160501.11<\/a><\/p>\n<p>Evidor, D. M. (2023). <em>Android development with Kotlin<\/em>.<\/p>\n<p>Hidayat, C., et al. (2024). PHP and MySQL web development.<\/p>\n<p>International Organization for Standardization. (2018). <em>ISO 9241-11:2018 Ergonomics of human-system interaction—Part 11: Usability: Definitions and concepts<\/em>. <a href=\"https://www.iso.org/standard/63500.html\">https://www.iso.org/standard/63500.html<\/a><\/p>\n<p>Jain, R., et al. (2024). Web development technologies.<\/p>\n<p>JetBrains. (n.d.). <em>Kotlin programming language<\/em>. <a href=\"https://kotlinlang.org\">https://kotlinlang.org<\/a><\/p>\n<p>Law Insider. (2026a). <em>Incident reporting definition<\/em>. <a href=\"https://www.lawinsider.com/dictionary/incident-reporting\">https://www.lawinsider.com/dictionary/incident-reporting<\/a><\/p>\n<p>Law Insider. (2026b). <em>Web-based definition<\/em>. <a href=\"https://www.lawinsider.com/dictionary/web-based\">https://www.lawinsider.com/dictionary/web-based<\/a><\/p>\n<p>Liang, Y. D. (2022). <em>Introduction to Java programming<\/em>.<\/p>\n<p>Maghanoy, J. A. (2019). <em>iReportMo: An emergency report Android mobile application for Metro Manila<\/em>. In 2019 IEEE 11th International Conference on Advanced Infocomm Technology (ICAIT) (pp. 199–202). <a href=\"https://doi.org/10.1109/ICAIT.2019.8935906\">https://doi.org/10.1109/ICAIT.2019.8935906<\/a><\/p>\n<p>Marcotte,
