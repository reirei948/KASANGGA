<body>
<title>KASANGGA Capstone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: fixed top bar with 3 views (Home hub · Manuscript reader with chapter rail · Presentation stage with thumbnail rail); every manuscript section and every slide cross-links */
:root{
  --bg:#f3f7f6; --surface:#ffffff; --fg:#17292b; --muted:#587073; --line:#d6e3e1;
  --deep:#0d3b3e; --deep-fg:#e4f1ef; --deep-muted:#9cc2c1;
  --accent:#16858b; --accent-soft:#e1f0ef; --chip:#eaf4f3; --stage:#0a2a2c;
  --display:"Lora", Georgia, "Times New Roman", serif;
  --read:"Literata", Georgia, "Times New Roman", serif;
  --ui:"Lato", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bar:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1819; --surface:#102324; --fg:#deecea; --muted:#94b0ae; --line:#21393a;
  --deep:#071d1f; --deep-fg:#d9ecea; --deep-muted:#7fa6a5;
  --accent:#4fc4c9; --accent-soft:#143236; --chip:#153033; --stage:#050f10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1819; --surface:#102324; --fg:#deecea; --muted:#94b0ae; --line:#21393a;
  --deep:#071d1f; --deep-fg:#d9ecea; --deep-muted:#7fa6a5;
  --accent:#4fc4c9; --accent-soft:#143236; --chip:#153033; --stage:#050f10; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--bar) + 16px)}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--deep);color:var(--deep-fg);padding-top:env(safe-area-inset-top,0px)}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:12px;padding-inline:16px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}
.brand img{width:30px;height:30px;object-fit:contain}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:.08em}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{color:var(--deep-muted);text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:8px;white-space:nowrap}
.tabs a:hover{color:var(--deep-fg);background:rgba(255,255,255,.07)}
.tabs a[aria-current="page"]{color:var(--deep-fg);background:rgba(255,255,255,.12)}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.18);color:var(--deep-fg);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
@media (max-width:640px){.brand b{display:none}.tabs a{padding:8px 9px;font-size:13px}.tabs .long{display:none}}
main{padding-top:calc(var(--bar) + env(safe-area-inset-top,0px))}

/* ---------- HOME ---------- */
.hero{background:var(--deep);color:var(--deep-fg);padding-inline:16px}
.hero-in{max-width:1100px;margin:0 auto;padding-block:48px 56px;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center}
.eyebrow{font-family:var(--ui);font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--deep-muted)}
.hero h1{font-family:var(--display);font-size:clamp(44px,8vw,84px);line-height:1;margin:14px 0 14px;letter-spacing:.04em}
.hero .sub{font-family:var(--display);font-style:italic;font-size:clamp(17px,2.2vw,22px);line-height:1.4;max-width:40ch;margin:0;text-wrap:balance}
.hero .meaning{margin:18px 0 0;color:var(--deep-muted);max-width:52ch}
.hero-logo{width:min(200px,28vw);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
.byline{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:26px;font-size:14px}
.byline span b{display:block;color:#fff;font-weight:700}
:root[data-theme="dark"] .byline span b{color:var(--deep-fg)}
.byline span{color:var(--deep-muted)}
@media (max-width:720px){.hero-in{grid-template-columns:1fr}.hero-logo{order:-1;width:96px}}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:-28px}
@media (max-width:760px){.doors{grid-template-columns:1fr}}
.door{display:grid;grid-template-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 10px 30px -18px rgba(5,40,42,.45);transition:transform .15s}
.door:hover{transform:translateY(-2px)}
.door .pic{aspect-ratio:16/7;background:var(--accent-soft);overflow:hidden;display:grid;place-items:center}
.door .pic img{width:100%;height:100%;object-fit:cover;object-position:top}
.door .txt{padding:18px 20px 20px}
.door h2{font-family:var(--display);margin:4px 0 4px;font-size:24px}
.door p{margin:0;color:var(--muted)}
.door .go{margin-top:12px;font-weight:900;color:var(--accent);font-size:14px}
.pages{display:flex;flex-direction:column;gap:2px;padding:28px 0 4px;margin:0;list-style:none;font-size:13px;color:var(--muted)}
h2.sect{font-family:var(--display);font-size:28px;margin:48px 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.guide{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.guide th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line)}
.guide td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.guide tr:last-child td{border-bottom:0}
.guide .ch{font-family:var(--display);font-weight:700;font-size:17px}
.guide .ch small{display:block;font-family:var(--ui);font-weight:400;color:var(--muted);font-size:14px}
.btnlink{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--chip);color:var(--accent);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btnlink:hover{background:var(--accent);color:var(--surface)}
.none{color:var(--muted);font-size:14px}
@media (max-width:600px){.guide thead{display:none}.guide tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}.guide td{padding:0;border:0}.guide td.c1{grid-column:1/-1}}
.foot{color:var(--muted);font-size:13px;padding-block:40px 48px;text-align:center}

/* ---------- MANUSCRIPT ---------- */
.ms{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1400px;margin:0 auto}
.rail{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:20px 12px 40px;font-size:14px}
.rail .ch-link{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-weight:700;line-height:1.3}
.rail .ch-link small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.rail .ch-link:hover{background:var(--chip)}
.rail .ch-link.on{background:var(--accent-soft);color:var(--accent)}
.rail ul{list-style:none;margin:2px 0 10px;padding:0 0 0 12px;border-left:2px solid var(--line);margin-left:16px}
.rail li a{display:block;padding:4px 8px;color:var(--muted);text-decoration:none;line-height:1.35}
.rail li.l3 a{padding-left:20px;font-size:13px}
.rail li a:hover{color:var(--fg)}
.rail li a.on{color:var(--accent);font-weight:700}
.reader{padding:32px 16px 80px;min-width:0}
.paper{max-width:760px;margin:0 auto}
.chead{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}
.chead .eyebrow{color:var(--accent)}
.chead h1{font-family:var(--display);font-size:clamp(28px,4vw,40px);line-height:1.15;margin:8px 0 12px;text-wrap:balance}
.chead .slidelinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.prose{font-family:var(--read);font-size:17.5px;line-height:1.75}
.prose p{margin:0 0 1em}
.prose h2{font-family:var(--display);font-size:26px;line-height:1.25;margin:2.2em 0 .4em;text-wrap:balance}
.prose h3{font-family:var(--display);font-size:20px;margin:1.8em 0 .4em}
.prose h4{font-family:var(--ui);font-size:15px;letter-spacing:.04em;margin:1.4em 0 .3em}
.prose h2 + .xref,.prose h3 + .xref{margin:-.1em 0 1em}
.xref{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.xref a{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--accent);text-decoration:none;font-weight:700}
.xref a:hover{background:var(--accent);color:var(--surface)}
.xref svg{width:12px;height:12px}
.prose figure.fig{margin:1.4em 0 .5em;text-align:center}
.prose figure.fig img{height:auto;width:auto;max-height:min(78vh,900px);border:1px solid var(--line);border-radius:6px;background:#fff}
.prose .caption{font-family:var(--ui);font-size:14px;color:var(--muted);text-align:center;font-style:italic;margin-bottom:1.6em}
.prose .tablewrap{overflow-x:auto;margin:1em 0 1.4em;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.prose table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:14px;line-height:1.45}
.prose td,.prose th{border:1px solid var(--line);padding:7px 10px;vertical-align:top;text-align:left}
.prose th,.prose thead td{background:var(--accent-soft)}
.prose td p{margin:0 0 .4em}.prose td p:last-child{margin:0}
.prose img{max-width:100%;height:auto}
.prose ol,.prose ul{padding-left:1.4em}
.titlepage{text-align:center;padding:28px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:24px}
.titlepage p{margin:0 0 .35em}
.titlepage p:first-child{font-family:var(--display);font-size:22px;line-height:1.35;margin-bottom:1em}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--ui)}
.pager a{text-decoration:none;display:flex;flex-direction:column;padding:12px 16px;border:1px solid var(--line);border-radius:10px;max-width:48%;background:var(--surface)}
.pager a small{color:var(--muted)}
.pager a b{color:var(--fg)}
.pager a.next{margin-left:auto;text-align:right}
.toc-btn{display:none}
@media (max-width:900px){
  .ms{grid-template-columns:1fr}
  .rail{position:fixed;top:calc(var(--bar) + env(safe-area-inset-top,0px));left:0;bottom:0;width:min(320px,86vw);height:auto;z-index:25;background:var(--surface);transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .rail.open{transform:none}
  .toc-btn{display:inline-flex;position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:26;align-items:center;gap:8px;background:var(--deep);color:var(--deep-fg);border:0;border-radius:999px;padding:11px 16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
}

/* ---------- PRESENTATION ---------- */
.pv{display:grid;grid-template-columns:minmax(0,1fr) 300px;max-width:1500px;margin:0 auto;gap:0}
.stagecol{padding:20px 16px 40px;min-width:0}
.stage{position:relative;background:var(--stage);border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center}
.stage img{width:100%;height:100%;object-fit:contain;display:block}
.stage .hit{position:absolute;top:0;bottom:0;width:30%;background:none;border:0;cursor:pointer}
.stage .hit.l{left:0}.stage .hit.r{right:0}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.ctrl .nav{display:flex;align-items:center;gap:6px}
.pbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:700;font-size:14px}
.pbtn:hover{border-color:var(--accent);color:var(--accent)}
.pbtn svg{width:16px;height:16px}
.count{font-variant-numeric:tabular-nums;font-weight:700;min-width:70px;text-align:center;color:var(--muted)}
.ctrl .sp{flex:1}
.slideinfo{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline}
.slideinfo .eyebrow{color:var(--accent)}
.slideinfo h1{font-family:var(--display);font-size:24px;margin:0;flex-basis:100%}
.readlink{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;background:var(--deep);color:var(--deep-fg);text-decoration:none;font-weight:700;font-size:14px}
.readlink:hover{background:var(--accent);color:#fff}
.readlink small{font-weight:400;color:var(--deep-muted)}
.readlink:hover small{color:#e6f5f4}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:640px){.hint{display:none}}
.thumbs{border-left:1px solid var(--line);height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));overflow-y:auto;padding:16px 12px 40px}
.thumbs h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 6px 8px}
.thumbs h3:first-child{margin-top:0}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid a{display:block;position:relative;border-radius:6px;overflow:hidden;border:2px solid transparent;text-decoration:none;background:var(--line)}
.tgrid a img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.tgrid a span{position:absolute;left:4px;bottom:4px;background:rgba(5,30,32,.82);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.tgrid a.on{border-color:var(--accent)}
@media (max-width:980px){.pv{grid-template-columns:1fr}.thumbs{position:static;height:auto;border-left:0;border-top:1px solid var(--line);padding-inline:16px}.tgrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}

/* comments + static views */
.view[hidden]{display:none!important}
.cbtn{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px dashed var(--accent);background:none;color:var(--accent);font:700 13px var(--ui);cursor:pointer}
.cbtn:hover{background:var(--accent-soft)}
.cbtn svg{width:13px;height:13px}
.cbtn[hidden]{display:none!important}
.notebar{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:28px;font-size:15px}
.notebar svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:2px}
.notebar b{display:block}
.notebar span{color:var(--muted)}
.slide{margin:0;width:100%;height:100%}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.stage .hit{z-index:2}

/* phone polish */
.brand img{background:#e4f1ef;border-radius:50%;padding:2px}
.stage{width:min(100%, calc((100dvh - var(--bar) - 120px) * 16 / 9));margin-inline:auto;min-width:min(100%,280px)}
.swipehint{display:none;font-size:13px;color:var(--muted)}
@media (hover:none) and (pointer:coarse){.hint{display:none}.swipehint{display:inline}}
@media (max-width:640px){
  .prose{font-size:16.5px}
  .prose figure.fig img{max-height:62vh}
  .reader{padding-bottom:110px}
  .ctrl{gap:8px}
  .ctrl .sp{display:none}
  .pbtn{height:42px;min-width:42px}
  .cbtn{padding:6px 12px}
  .slideinfo h1{font-size:21px}
  .doors{margin-top:-20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="application/json" id="data">{"chapters": [{"id": "front", "label": "Front Matter", "subtitle": "Title Page, Approval, Acknowledgement, Dedication, Abstract", "sections": [{"id": "title-page", "title": "Title Page", "level": 2}, {"id": "approval-sheet", "title": "Approval Sheet", "level": 2}, {"id": "acknowledgement", "title": "Acknowledgement", "level": 2}, {"id": "dedication", "title": "Dedication", "level": 2}, {"id": "abstract", "title": "Abstract", "level": 2}], "html": "\n\n\n\n\n\n\n\n\n\n\n\n\n\n<div class=\"titlepage\" id=\"title-page\"><p><strong>KASANGGA: A MOBILE-BASED VIOLENCE AGAINST WOMEN AND CHILDREN (VAWC) REPORTING AND ASSISTANCE SYSTEM WITH WEB-BASED ADMIN DASHBOARD<\/strong><\/p><p>A Capstone Project<\/p><p>Presented to the Faculty of the College of Informatics and Computing Innovations<\/p><p>Iloilo State University of Fisheries Science and<\/p><p>Technology-San Enrique Campus<\/p><p>San Enrique, Iloilo<\/p><p>In Partial Fulfillment of the Requirements for the Degree<\/p><p>BACHELOR OF SCIENCE IN INFORMATION TECHNOLOGY<\/p><p>By<\/p><p>RHEA C. SERQUILLOS<\/p><p>WILLIAM S. CEPRIANO<\/p><p>KIZAIH A. DEVECAIS<\/p><p>RHEA MAE C. PORCAL<\/p><p>2026<\/p><\/div><h2 id=\"approval-sheet\">Approval Sheet<\/h2>\n<p>This Capstone Project, “KASANGGA: A Mobile-Based Violence Against Women and Children (VAWC) Reporting and Assistance System with Web-Based Admin Dashboard”, has been prepared and submitted by Rhea C. Serquillos, William S. Cepriano, Kizaih A. Devecais, and Rhea Mae C. Porcal in partial fulfillment of the requirements of the degree Bachelor of Science in Information Technology is hereby approved with a grade of ______.<\/p>\n<p><strong><u>WENDA D. PANES, EdD<\/u><\/strong><\/p>\n<p>Adviser<\/p>\n<p><strong>DAVE ALLAN A. TAGACAY, MIT WEENA J. BULNES, EdD<\/strong><\/p>\n<p>Chairman Member<\/p>\n<p><strong>DYTHNE P. DACUDAO, EdD<\/strong><\/p>\n<p>Member<\/p>\n<p>Accepted in partial fulfillment of the requirements for the degree of Bachelor of Science in Information Technology.<\/p>\n<div class=\"tablewrap\"><table>\n\n<tbody>\n<tr class=\"odd\">\n<td>Date<\/td>\n<td><p><strong><u>WENDA D. PANES, EdD<\/u><\/strong><\/p>\n<p>Dean, College of Informatics and<\/p>\n<p>Computing Innovations<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"acknowledgement\">Acknowledgement<\/h2>\n<p>We wish to express our deepest gratitude to the people who, in one way or another, helped make KASANGGA possible.<\/p>\n<p>To the Campus Administrator of Iloilo State University of Fisheries Science and Technology – San Enrique Campus, Michael B. Dizon, EdD, PhD, for permitting us to conduct this study.<\/p>\n<p>To the Honorable Municipal Mayor of San Enrique, Hon. Gian Carlo Niño P. Fernandez, for granting us permission to conduct surveys and gather information across the 28 barangays of the municipality.<\/p>\n<p>To our capstone adviser, Dr. Wenda D. Panes, for her patience, her honest feedback, and her trust in our ability to finish what we started. Her guidance shaped this study from its earliest draft to its final form.<\/p>\n<p>To the members of our panel, Mr. Dave Allan A. Tagacay, Dr. Weena J. Bulnes, and Dr. Dythne P. Dacudao, for their valuable comments and suggestions, which greatly improved both our system and this manuscript.<\/p>\n<p>To Mr. Ivan Silvestre, for his time and effort in conducting the quality assurance of our study.<\/p>\n<p>To the barangay officials, the Women and Children Protection Desk officers, and the personnel of the Municipal Social Welfare and Development Office of San Enrique, for sharing their time, experience, and insights on how VAWC cases are reported and handled in the community.<\/p>\n<p>To our respondents, for their willingness to test the system and give honest answers during its evaluation.<\/p>\n<p>To our families, for their love, understanding, and support, both moral and financial, and for believing in us even when the work seemed endless.<\/p>\n<p>To our classmates and friends in BSIT 4B, for the encouragement, the shared struggles, and the laughter that made this journey lighter.<\/p>\n<p>To everyone who contributed to the success of this study, whose names may not all be written here, thank you.<\/p>\n<p>Above all, to Almighty God, for His guidance and grace, and for granting us the wisdom, strength, patience, and courage to keep going through the long nights and difficult days of this study. To Him be all the glory.<\/p>\n<p>R.C.S. W.S.C. K.A.D. R.M.C.P.<\/p>\n<h2 id=\"dedication\">Dedication<\/h2>\n<p>With a grateful heart, I dedicate this book to the people who walked beside me throughout this journey, who held me up when I was tired and cheered me on when I doubted myself.<\/p>\n<p>To my family, my home and my foundation. To Tatay and Nanay, thank you for your sacrifices, your patience, and your quiet ways of showing love, even on the days I came home with nothing to say but how exhausted I was. To Ate Joy, Kuya Ryan, and my twin brother, Rhenan, thank you for always looking out for me and for being there whenever I needed you. And to my nieces, Christell and Bera, who are also my best friends, thank you for helping me throughout this journey and for staying by my side every step of the way. Everything I do, I do with all of you in mind.<\/p>\n<p>To my best friends, Emily, Jan Laurence, April, Carol, and Nichole, thank you for the late-night talks, the endless laughter, and the reminders to rest when I forgot to. You made the hardest days feel lighter, and I will always treasure the moments we shared.<\/p>\n<p>To our capstone adviser, Ma’am Wenda, thank you for believing in what we could do before we believed it ourselves. Your guidance and encouragement pushed us to aim higher, and I will carry your lessons with me long after this book is finished. To Sir Tags, Ma’am Bulnes, Ma’am Dythne, and Ma’am Anne, thank you for your valuable feedback, guidance, and suggestions, which helped shape our system into something better. And to all the faculty and staff of CICI, thank you for the knowledge, patience, and support you have given us throughout our years in the college.<\/p>\n<p>To my teammates in Team INNOTRIX, William, Kizaih, and Rhea Mae, thank you for every sleepless night, every debugging session, and every time we chose to keep going instead of giving up. KASANGGA exists because of all of us.<\/p>\n<p>To my CICI family, thank you for the trust, the experiences, and the chances to grow beyond the classroom.<\/p>\n<p>Above all, I dedicate this book to God Almighty, my strength when I had none left and my peace in the middle of every storm. Thank You for every answered prayer, and for carrying me through each challenge that came my way.<\/p>\n<p>And lastly, to my boyfriend, Johnroy, or as I call him, my Adi, my true blessing from the Lord. Thank you for motivating me every single day. You were there through the late nights, the endless revisions, and the moments when I felt like I had nothing left to give. Thank you for listening to all my rants and worries without ever getting tired of me, for reminding me to eat and rest when I forgot to take care of myself, and for believing in me even on the days I could not believe in myself. Your patience, your encouragement, and your quiet ways of showing that you care gave me the strength to keep going. You celebrated my small wins as if they were your own and held my hand through every setback. This achievement is also yours, because a part of my strength came from you. Thank you for staying, and for choosing to walk this journey with me.<\/p>\n<p>This book is a reflection of all the love, prayers, and support that surrounded me. I could not have done this alone, and I will always be grateful to everyone who was part of this journey.<\/p>\n<p>R.C.S<\/p>\n<p>This Capstone Project is wholeheartedly dedicated to the people who have been an essential part of our journey, whose unwavering support, encouragement, guidance, patient, and love hav ion helped us recognise our weaknesses and improve the quality of our work. Your commitment to helping us achieve the objectives of this project has greatly contributed to its completion.<\/p>\n<p>To our classmates and friends, thank you for being part of my lives. Your encouragement, assistance, ideas, laughter, and championship made the challenges of our academic journey more manageable whether through discussions, shared experiences, late-night conversations, or simple words of encouragement, you reminded us that we were never alone in facing the difficulties that came along the way. The memories we created throughout this journey will always be cherished.<\/p>\n<p>To our capstone group members, this dedication is also for each one of us who contributed time, effort, ideas, skills, and commitment to making this project possible. The completion of this capstone project was not the result of one person’s effort but of our collective determination and teamwork. We experienced moments of pressure, disagreement, exhaustion, uncertainly, and frustration, but we also learned how to communicate, cooperate, compromise, and support one another. Every challenge we overcome strengthened our ability to work as a team and reminded us of the importance of perseverance and shared responsibility.<\/p>\n<p>To everyone who participated in, supported, or contributed to the development of this project, whether directly or indirectly, we extend our sincere gratitude. Your assistance, feedback, cooperation, and encouragement played an important role in helping us accomplish our goals. Even the smallest act of kindness or support became meaningful during the process of completing this project.<\/p>\n<p>Finally, we dedicate this capstone project to our future selves. This project represents more than an academic requirement, it represents the countless hours of effort, uncertainty, and determination that brought us to this point. It serves as a reminder that difficult challenges can be o ree.<\/p>\n<p>To my friends, classmates, and Capstone group mates, I am grateful for your cooperation, encouragement, patience, and companionship throughout this academic journey. The challenges, experiences, and memories we shared have contributed greatly to my growth and have made this journey more meaningful.<\/p>\n<p>To my Capstone Adviser, ma’am Wenda D. Panes, and to all our instructor and professors, I sincerely thank you for your guidance , knowledge, constructive feedback, patience, and encouragement. Your dedication to teaching and mentoring has greatly contributed to the successful completion of this project and to my development as a student and future professional.<\/p>\n<p>To everyone who supported me in my way, whether through advice, encouragement, prayers, or simple acts of kindness, I extend my heartfelt appreciation. Every form of support, no matter how small, became meaningful throughout this journey.<\/p>\n<p>Above all, I dedicate this achievement to Almighty God, for providing me with the wisdom, strength, patience, courage, and guidance necessary to overcome every challenge. I am deeply grateful for the blessings, opportunities, and lessons that have guided me toward this milestone.<\/p>\n<p>Finally, I dedicate this achievement to my self for having the courage to continue despite the challenges, doubts, failures, and moments of exhaustion. This journey has taught me the value of perseverance, patience, responsibility, and faith. KASNGGA is more than academic requirement. It presents the dedication, perseverance, sacrifices, and collectives efforts that made its completion possible. This achievement may bear my name, but it is also a reflection of the love, support, and contributions of the people who stood beside me.<\/p>\n<p>K.A.D<\/p>\n<p>First of all, I would like to dedicate this Capstone Project to Almighty God, because without his guidance, strength, and blessings, this achievement would not have been possible. Throughout the journey of cult times.<\/p>\n<p>To my friends and classmates, thank you for being part of my college journey. College was not always easy, and there were many stressful days, especially when we had deadlines activities, and projects to finish. Having friends and classmates who were also going through the same struggles made things a little easier. Thank you for the help, encouragement, conversations, jokes, and memories that we shared. Even the small things meant a lot, especially during the times when I felt pressure or tired.<\/p>\n<p>I would also like to give special thanks to our Capstone Project leader, Rhea Serquillos. Thank you for all the sacrifices, time, and effort you gave just to make our project successful. I know that being a leader was not easy, especially when there were many things that needed to be done and problems that we had to solve. Despite all the pressure and challenges, you continued to do your part and made sure that we were able to move forward with our project. I truly appreciate all the effort you gave to our group. There were times when you had to sacrifice your own time just to work on the project and make sure that everything was properly done. Your dedication and effort helped us a lot throughout the process. I am thankful that you became our leader and that I had the chance to work with you and the rest of the group.<\/p>\n<p>To my group mates, thank you for your cooperation and for the effort you gave to our Capstone Project. We had different challenges along the way, including revisions, technical problems, deadlines, and moments when we were all tired and pressured. Even so, we continued working together and did our best to finish the project. Every contribution, idea, and effort became an important part of our work.<\/p>\n<p>Making this Capstone Project taught me that teamwork is very important. It was not always easy to agree on everything problem right away, but we learned how to work with each other, communicate, and help one another. The difficulties we experienced became part of our learning, and I will always remember this experience.<\/p>\n<p>I would like also like to express my sincere gratitude to our teachers who guided and supported us throughout the completion of our Capstone Project. Thank you for sharing your knowledge, giving us advice, and helping us whenever we encountered difficulties. Your guidance and encouragement helped us understand that we needed to improve and taught us to be more responsible in doing our work. We truly appreciate the time and effort you gave to guide us throughout this journey.<\/p>\n<p>Most especially, I would like to give my heartfelt thanks to our Capstone Project Ma’am Wenda Panes, thank you for your patience, guidance, and understanding throughout the entire process. Your advice, corrections, and suggestions helped us improve our project and encouraged us to keep going even when we faced challenges. We are truly grateful for the time and effort you gave to guide us until we were able to complete our Capstone Project. Your support played an important part in making this project successful, and I will always be thankful for everything you have done for us.<\/p>\n<p>I am also thankful to everyone who helped and supported me in any way during this journey. Some people may have helped through advice, some through encouragement, and others simply by being there when I needed someone to talk to. Sometimes, even a simple message or a few encouraging words could make a stressful day feel a little lighter. I may not be able to mention everyone, but I sincerely appreciate every person who became part of this journey.<\/p>\n<p>Lastly, I would like to dedicate this achievement to my self. I know that there were many times when I felt tired, stressed, and unsure if I could finish everything. There were moments when I wanted to stop and just rest because everything felt overwhelming. But even with all those difficulties, I still continued. This journey taught me that I do not have to be perfect to accomplish something. What matters is that I continue trying even when things become difficult. I learned to be more patient, responsibilities, and determined. The sleepless nights, deadlines, mistakes, revision, and stressful moments were not easy, but they became part of the experience that helped me grow.<\/p>\n<p>This Capstone Project is more than just a requirement for us. It represents the time, effort, sacrifices, and support of the people who helped us long the way. Behind this projects are my parents who continued to support me even when things were difficult, my sibling who stayed supportive, my friends and classmate who made the journey easier, my group mates who worked with me, our teachers who guided us, and especially to our adviser and leader, who gave so much effort and made many sacrifices for the success of our project. Most importantly, I give my thanks to God, because he gave us the strength and opportunity to finish what we started. Without his guidance and without the people who supported me, I would not have reached this point.<\/p>\n<p>To everyone who believed in me, supported me, encouraged me, helped me, and stayed with me throughout this journey, thank you so much. Thus achievements may have name on it, but I know that I did not reach this point alone. A part of this achievement belong to all of you.<\/p>\n<p>R.M.C.P<\/p>\n<h2 id=\"abstract\">Abstract<\/h2>\n<p>Violence Against Women and Children (VAWC) remains underreported in many communities because victims are afraid, lack information, or have no safe and accessible way to report. This study aimed to develop KASANGGA: A Mobile-Based Violence Against Women and Children (VAWC) Reporting and Assistance System with Web-Based Admin Dashboard, and to determine its acceptability in terms of usability. The mobile application allows residents of San Enrique, Iloilo to submit confidential VAWC reports with photo or video evidence, track the status of their reports, contact the barangay captain and VAWC desk officer of the 28 barangays, read simplified VAWC-related laws, and receive guidance from Lumi, an AI chatbot that communicates in Kinaray-a, Tagalog, and English. The web-based dashboard enables Barangay Admins to verify and manage reports, while the Super Admin of the Municipal Social Welfare and Development Office (MSWDO) monitors cases and manages accounts. The system was developed following the Agile methodology using Android Studio with Kotlin and Java, Visual Studio Code with HTML, CSS, JavaScript, and PHP, and a MySQL database. The study employed a descriptive-developmental research design. Barangay officials and MSWDO personnel were selected through purposive sampling, while three (3) residents from each of the 28 barangays were selected through simple random sampling. The usability of the system will be evaluated using the System Usability Scale (SUS). [Results: The system obtained a mean SUS score of ____, interpreted as ____.] [Conclusion to follow after the usability evaluation.]<\/p>\n<p><strong>Keywords:<\/strong> VAWC, mobile application, web-based dashboard, AI chatbot, Agile methodology, System Usability Scale<\/p>\n"}, {"id": "ch1", "label": "Chapter I", "subtitle": "Introduction", "sections": [{"id": "background-of-the-study", "title": "Background of the Study", "level": 2}, {"id": "objectives-of-the-study", "title": "Objectives of the Study", "level": 2}, {"id": "conceptual-framework", "title": "Conceptual Framework", "level": 2}, {"id": "scope-and-limitations-of-the-study", "title": "Scope and Limitations of the Study", "level": 2}, {"id": "significance-of-the-study", "title": "Significance of the Study", "level": 2}, {"id": "definition-of-terms", "title": "Definition of Terms", "level": 2}], "html": "\n\n<p>This chapter includes the (1) Background of the Study, (2) Objectives of the Study, (3) Conceptual Framework, (4) Scope and Limitations of the Study, (5) Significance of the Study, and (6) Definition of Terms.<\/p>\n<h2 id=\"background-of-the-study\">Background of the Study<\/h2>\n<p>Ensuring the safety and protection of women and children is an important responsibility of both local authorities and the community. Cases of Violence Against Women and Children (VAWC), such as physical abuse, emotional abuse, sexual harassment, and domestic violence, need to be reported immediately to prevent further harm. However, in many communities, these cases are often not reported on time because victims are afraid, feel ashamed, lack information, or do not have safe and easy ways to report. In some situations, going to authorities in person or making phone calls is not safe or possible, especially during emergencies. According to UN Women et al. (2015), reporting systems for sensitive cases should be simple, safe, and private so that victims will feel encouraged to ask for help.<\/p>\n<p>With the help of modern technology, mobile-based systems have become useful in improving communication and response in public services. The World Bank (2016) explains that digital technology helps make services faster, more accessible, and more efficient. Mobile applications allow users to report incidents in real time, share their location through GPS, and quickly send alerts to the right authorities. These features are very helpful in VAWC cases because fast response is needed to protect victims. Digital systems can also help authorities study reports to find common places where incidents happen and improve their response and prevention plans.<\/p>\n<p>In response to these problems, this study proposes KASANGGA: A mobile-based Violence Against Women and Children (VAWC) reporting system with a web-based admin dashboard. The system allows users to report VAWC incidents safely and privately using their mobile phones, and gives them a directory of barangay officials’ contact numbers so they can reach the right authorities. In addition, the system has an AI chatbot named Lumi that communicates in Kinaray-a, Tagalog, and English to guide users and provide basic help. The web-based dashboard is used by authorized personnel such as barangay officials, Women and Children Protection Desk officers, and social workers to monitor and respond to reports quickly. This study aims to develop and evaluate the KASANGGA system to improve access to reporting, encourage faster reporting of VAWC cases, and strengthen protection for women and children.<\/p>\n<h2 id=\"objectives-of-the-study\">Objectives of the Study<\/h2>\n<p>This research study aimed to develop KASANGGA: A mobile-based violence against women and children (VAWC) reporting and assistance system with a web-based admin dashboard and determine its acceptability.<\/p>\n<p>Specifically, the study aimed to:<\/p>\n<ol type=\"1\">\n<li><p>design KASANGGA: A mobile-based violence against women and children (VAWC) reporting and assistance system with a web-based admin dashboard; and<\/p><\/li>\n<li><p>determine the acceptability of KASANGGA in terms of its usability.<\/p><\/li>\n<\/ol>\n<h2 id=\"conceptual-framework\">Conceptual Framework<\/h2>\n<p>The conceptual framework of the study illustrates the relationship of variables using the Input–Process–Output (IPO) model, as shown in Figure 1. It presents how the required inputs are transformed into the desired output within the context of Violence Against Women and Children (VAWC) reporting.<\/p>\n<p>The input consists of the user, software, and hardware requirements needed in the development of the KASANGGA system. The users include victims or reporters of VAWC cases, authorized responders, and administrators such as barangay officials and Women and Children Protection Desk officers. The inputs also include data such as user information, VAWC incident reports, and location details. In addition, it involves the tools and technologies used in developing the mobile application and web-based admin dashboard, as well as the devices such as smartphones and computers used to access the system.<\/p>\n<p>The process involves the design and development of the system using the Agile methodology. This includes planning, system design, and implementation of key features such as secure VAWC incident reporting, a barangay contacts directory, and Lumi AI chatbot assistance. It also includes system testing and refinement to ensure functionality, usability, and reliability.<\/p>\n<p>The output of the study is a mobile-based Violence Against Women and Children (VAWC) reporting system with a web-based admin dashboard. It also includes the results of the system evaluation based on usability, measured using the System Usability Scale (SUS), to determine how effective and user-friendly the system is for its intended users.<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1152\" loading=\"lazy\" src=\"media1/m001.jpg\" width=\"1400\"/><\/figure>\n<p class=\"caption\"><em>Figure 1: Input-Process-Output (IPO) Diagram.<\/em><\/p>\n<h2 id=\"scope-and-limitations-of-the-study\">Scope and Limitations of the Study<\/h2>\n<p>This study focused on the development and evaluation of KASANGGA: A Mobile-Based Violence Against Women and Children (VAWC) Reporting and Assistance System with a Web-Based Admin Dashboard. The study adopts a developmental research design and follows the Agile system development model to support iterative development and continuous improvement of the system. The study was conducted in all 28 barangays of San Enrique, Iloilo from August to November 2026, covering both system development and evaluation. The research instrument used a structured questionnaire based on the System Usability Scale (SUS) to evaluate the system in terms of usability, specifically focusing on ease of use, efficiency, and user satisfaction.<\/p>\n<p>The respondents of the study were selected using a combination of purposive sampling and simple random sampling. Purposive sampling was used to select two (2) barangay officials, the barangay captain and the Women and Children Protection Desk (VAWC) officer, from each of the 28 barangays, and one (1) Municipal Social Welfare and Development Office (MSWDO) personnel who serves as the Super Admin. Simple random sampling was used to select three (3) residents from each of the 28 barangays of San Enrique to ensure fair representation.<\/p>\n<p>The system is designed for reporting Violence Against Women and Children (VAWC) cases, including physical abuse, domestic violence, sexual harassment, emotional abuse, and related incidents. The mobile application includes features such as user registration and login, incident reporting with descriptions, location input, optional evidence uploads, anonymous reporting, chatbot assistance from Lumi in Kinaray-a, Tagalog, and English, records retrieval, and hotline contacts.<\/p>\n<h2 id=\"significance-of-the-study\">Significance of the Study<\/h2>\n<p>This study on KASANGGA: A Mobile-Based Violence Against Women and Children (VAWC) Reporting System with a Web-Based Admin Dashboard is beneficial to the following:<\/p>\n<p><strong>Victims and Residents.<\/strong> This system provides a safer, easier, and more confidential way for victims and residents to report Violence Against Women and Children (VAWC) incidents. It allows users to submit reports, access barangay contact information, and review VAWC-related laws.<\/p>\n<p><strong>Barangay Officials.<\/strong> This system helps barangay officials, particularly the Barangay Captain and Women and Children Protection Desk (VAWC Desk) officers, by providing faster access to reported incidents and streamlining case monitoring.<\/p>\n<p><strong>Municipal Social Welfare and Development Office (MSWDO).<\/strong> This system assists the MSWDO in managing and monitoring VAWC cases through a centralized reporting platform. It helps ensure proper documentation and coordinated response to reported incidents.<\/p>\n<p><strong>Community of San Enrique.<\/strong> This system benefits the entire community by improving awareness, accessibility, and response to VAWC incidents. It promotes a safer environment by encouraging timely reporting.<\/p>\n<p><strong>Future Researchers.<\/strong> This study serves as a reference for future researchers who plan to develop similar mobile-based systems related to VAWC reporting, community safety, or incident reporting systems.<\/p>\n<h2 id=\"definition-of-terms\">Definition of Terms<\/h2>\n<p>This section provides precise definitions of key terms as they are used within the context of the study, thereby ensuring clarity and consistency in interpretation for all readers.<\/p>\n<p><strong>Admin Dashboard.<\/strong> An admin dashboard is a centralized user interface that provides administrators with tools to monitor, manage, and control system operations (Superworks, n.d.).<\/p>\n<p>In this study, the Admin Dashboard in KASANGGA is used by barangay officials and MSWDO personnel to view, validate, and manage Violence Against Women and Children (VAWC) incident reports<strong>.<\/strong><\/p>\n<p><strong>Agile.<\/strong> Agile methodology is an iterative and incremental approach to software development that promotes adaptive planning, early delivery, and continuous improvement (TechTarget, n.d.-b; Atlassian, n.d.).<\/p>\n<p>In this study, Agile refers to the methodology followed by researchers to develop KASANGGA in iterative cycles with continuous improvement.<\/p>\n<p><strong>AI Chatbot.<\/strong> An AI chatbot is a computer program that uses artificial intelligence to simulate human conversation and provide assistance or guidance (Russell &amp; Norvig, 2021).<\/p>\n<p>In this study, the AI chatbot, named Lumi, is a feature of KASANGGA that communicates in Kinaray-a, Tagalog, and English, and provides guidance, information, and assistance related to VAWC reporting.<\/p>\n<p><strong>Database.<\/strong> A database is a structured collection of data stored electronically for efficient access and management (Elmasri &amp; Navathe, 2016).<\/p>\n<p>In this study, the Database stores user information, incident reports, and system logs securely.<\/p>\n<p><strong>Emergency.<\/strong> An emergency refers to a sudden and serious situation that requires immediate action to prevent harm, injury, or loss of life (World Health Organization, 2023).<\/p>\n<p>In this study, Emergency refers to urgent VAWC-related situations reported through the system that require attention from barangay officials and concerned offices.<\/p>\n<p><strong>Hardware.<\/strong> Hardware refers to the physical components of a computer system (Tanenbaum &amp; Bos, 2015).<\/p>\n<p>In this study, Hardware includes devices such as laptops, smartphones, and tablets used to develop and access KASANGGA.<\/p>\n<p><strong>HTML (HyperText Markup Language).<\/strong> HTML is the standard markup language used to structure content on the web (W3C, 2023).<\/p>\n<p>In this study, HTML is used to design and structure the user interface of KASANGGA system, particularly for admin dashboard and web components.<\/p>\n<p><strong>Incident Reporting.<\/strong> Incident reporting is the process of reporting events that require attention or intervention (Law Insider, 2026a).<\/p>\n<p>In this study, Incident Reporting refers to residents submitting reports of crimes, accidents, and emergencies through KASANGGA application.<\/p>\n<p><strong>Java.<\/strong> Java is a programming language used for building applications that run on different platforms through the Java Virtual Machine (Oracle, n.d.).<\/p>\n<p>In this study, Java is used to develop system functionalities such as processing user input and managing data.<\/p>\n<p><strong>JavaScript.<\/strong> JavaScript is a programming language used to create interactive and dynamic web content (Mozilla, n.d.).<\/p>\n<p>In this study, JavaScript is used to enhance system functionality, including user interaction, form validation, and real-time updates.<\/p>\n<p><strong>KASANGGA.<\/strong> It is a mobile application designed to improve community safety by enabling residents to report incidents, communicate with authorities, and receive emergency assistance.<\/p>\n<p><strong>Kotlin.<\/strong> Kotlin is a modern programming language used for Android application development that runs on the Java Virtual Machine (JetBrains, n.d.).<\/p>\n<p>In this study, Kotlin is used to develop mobile application features such as user interfaces and system functions.<\/p>\n<p><strong>Login/Registration.<\/strong> Login/registration is the process of verifying and authenticating users before granting access to a system (TechTarget, n.d.-a).<\/p>\n<p>In this study, Login/Registration refers to the user authentication process in KASANGGA.<\/p>\n<p><strong>Mobile Application.<\/strong> A mobile application is a software application designed to run on mobile devices such as smartphones and tablets (Techopedia, n.d.).<\/p>\n<p>In this study, Mobile Application refers to the KASANGGA application used for incident reporting and emergency communication.<\/p>\n<p><strong>PHP.<\/strong> PHP is a server-side scripting language used for web development to create dynamic and interactive web pages (W3Schools, n.d.).<\/p>\n<p>In this study, PHP is used to handle server-side processes such as data processing, storing incident reports, and managing communication between the application and the database.<\/p>\n<p><strong>Residents.<\/strong> Residents are individuals living in a specific community or area (World Bank, 2016).<\/p>\n<p>In this study, Residents refer to users of KASANGGA who report incidents or request assistance.<\/p>\n<p><strong>System.<\/strong> A system is a set of interconnected components working together to achieve a goal (Stair &amp; Reynolds, 2020).<\/p>\n<p>In this study, System refers to the KASANGGA mobile application.<\/p>\n<p><strong>Usability.<\/strong> Usability is the degree to which a system can be used effectively, efficiently, and satisfactorily by users (ISO 9241-11, 2018).<\/p>\n<p>In this study, Usability refers to how easy and user-friendly KASANGGA is for residents and officials.<\/p>\n<p><strong>Visual Studio Code.<\/strong> Visual Studio Code is a source code editor developed by Microsoft used for programming and debugging (Microsoft, n.d.).<\/p>\n<p>In this study, Visual Studio Code is used as a development tool for the system.<\/p>\n<p><strong>Web-based.<\/strong> Web-based refers to an external application that is accessed through a web browser over the internet (Law Insider, 2026b).<\/p>\n<p>In this study, web-based means that the KASANGGA admin dashboard is accessible through different devices such as laptops, tablets, and smartphones using a web browser with an internet connection.<\/p>\n"}, {"id": "ch2", "label": "Chapter II", "subtitle": "Review of Related Literature and Systems", "sections": [{"id": "san-enrique-iloilo", "title": "San Enrique, Iloilo", "level": 2}, {"id": "system-usability-scale", "title": "System Usability Scale", "level": 2}, {"id": "web-development", "title": "Web Development", "level": 2}, {"id": "html", "title": "HTML", "level": 3}, {"id": "css", "title": "CSS", "level": 3}, {"id": "javascript", "title": "JavaScript", "level": 3}, {"id": "php", "title": "PHP", "level": 3}, {"id": "mysql", "title": "MySQL", "level": 3}, {"id": "app-development", "title": "App Development", "level": 2}, {"id": "android-studio", "title": "Android Studio", "level": 3}, {"id": "java", "title": "Java", "level": 3}, {"id": "kotlin", "title": "Kotlin", "level": 3}, {"id": "xampp", "title": "XAMPP", "level": 2}, {"id": "visual-studio-code", "title": "Visual Studio Code", "level": 2}, {"id": "related-systems", "title": "Related Systems", "level": 2}, {"id": "ireportmo-an-emergency-report-android-mobile-app", "title": "iReportMo: An Emergency Report Android Mobile Application for Metro Manila", "level": 3}, {"id": "matrix-of-related-studies", "title": "Matrix of Related Studies", "level": 2}, {"id": "synthesis", "title": "Synthesis", "level": 2}, {"id": "prior-art", "title": "Prior Art", "level": 2}, {"id": "summary", "title": "Summary", "level": 2}], "html": "\n\n<p>This chapter presents literature and systems related to the present study in the following order: (1) San Enrique, Iloilo, (2) System Usability Scale, (3) Web Development, (4) HTML, (5) CSS, (6) JavaScript, (7) PHP, (8) MySQL, (9) App Development, (10) Android Studio, (11) Java, (12) Kotlin, (13) XAMPP, (14) Visual Studio Code, (15) iReportMo: An Emergency Report Android Mobile Application for Metro Manila, (16) iSafeButuan: A GPS-Enabled Android Mobile Application Enhancing Citizen-Police Collaboration for Incident Reporting and Emergency Response, (17) Disaster Emergency Events Application (DEAPP): Secure Cross-Layer Mobile Sensing Framework for Real-Time Disaster Reporting and Visualization Using a Mobile Application, (18) Matrix of Related Studies, (19) Synthesis, (20) Prior Art, and (21) Summary.<\/p>\n<h2 id=\"san-enrique-iloilo\">San Enrique, Iloilo<\/h2>\n<p>San Enrique, Iloilo is a fourth-class municipality located in the province of Iloilo on Panay Island. It was established as an independent municipality after being separated from neighboring towns and has since developed into a community composed of several barangays.<\/p>\n<p>The municipality is primarily agricultural, with many residents relying on farming and small-scale businesses as their main sources of livelihood. Despite ongoing development, San Enrique still experiences challenges in terms of infrastructure, accessibility, and communication systems.<\/p>\n<p>These conditions emphasize the need for improved methods of communication and efficient systems that can support public safety, particularly in reporting incidents and responding to emergencies. The growing use of mobile technology within the community presents an opportunity to introduce digital solutions that can enhance coordination and response efficiency.<\/p>\n<h2 id=\"system-usability-scale\">System Usability Scale<\/h2>\n<p>The System Usability Scale (SUS), developed by John Brooke (1996), is a standardized tool used to evaluate system usability based on user perception of effectiveness, efficiency, and satisfaction. SUS consists of ten items rated on a five-point Likert scale, producing a total score ranging from 0 to 100. A score of 68 is considered the average benchmark for usability, while higher scores indicate better usability and user satisfaction. SUS is widely recognized as a reliable and valid instrument for evaluating user experience across different software systems.<\/p>\n<h2 id=\"web-development\">Web Development<\/h2>\n<p>Web development involves creating and maintaining websites and web applications through frontend and backend development. It includes designing user interfaces, ensuring responsiveness, and implementing functionalities that enhance the overall user experience. In the KASANGGA system, web development technologies are used to build the web-based admin dashboard that allows administrators and super administrators to manage reports, accounts, and system data.<\/p>\n<h3 id=\"html\">HTML<\/h3>\n<p>HTML is the standard language used to create the structure of web pages. It defines the content and layout of websites, such as text, images, and links. According to Jain et al. (2024), HTML is essential in web development because it provides the basic structure needed for all websites.<\/p>\n<p>HTML is easy to learn and widely supported by all web browsers, making it accessible for developers. It is often used together with CSS and JavaScript to create interactive websites. According to Duckett (2022), HTML allows developers to organize content clearly and effectively for users.<\/p>\n<p>As web technologies evolve, HTML continues to improve with new features that support multimedia and responsive design. According to W3C (2023), modern HTML standards help developers create more accessible and user-friendly web applications.<\/p>\n<h3 id=\"css\">CSS<\/h3>\n<p>CSS is used to design, and style web pages created with HTML. It controls the layout, colors, fonts, and overall appearance of a website. According to Jain et al. (2024), CSS improves the visual design of websites, making them more attractive and easier to use.<\/p>\n<p>CSS also supports responsive design, which allows websites to adjust to different screen sizes such as mobile phones and tablets. According to Marcotte (2011), CSS helps developers create flexible and adaptive designs that improve user experience.<\/p>\n<p>In addition, CSS simplifies web development by separating design from content. This makes it easier to update and maintain websites. According to W3C (2023), CSS enhances the usability and accessibility of web applications, making it an essential part of modern web development.<\/p>\n<h3 id=\"javascript\">JavaScript<\/h3>\n<p>JavaScript is a programming language used to create interactive and dynamic web content (Mozilla, n.d.). It allows web pages to respond to user actions and update content without requiring the page to reload, making websites more interactive and responsive.<\/p>\n<p>In the KASANGGA web-based admin dashboard, JavaScript is used to enhance system functionality, including form validation, real-time updates, and the generation of charts for monitoring reports and user activity.<\/p>\n<h3 id=\"php\">PHP<\/h3>\n<p>PHP is a server-side programming language used to create dynamic and interactive web applications. It allows developers to process user input, connect to databases, and generate web content. According to Hidayat et al. (2024), PHP is effective in building web systems that require data processing and user interaction. PHP is widely used because it is easy to learn and has strong support from the developer community. It also works well with MySQL for managing data. According to Rio and Abreu (2023), PHP remains popular in web development due to its flexibility and wide range of available tools.<\/p>\n<p>However, developers must follow proper coding practices when using PHP to ensure system security and performance. According to Jain et al. (2024), maintaining good coding standards in PHP helps reduce errors and improve system reliability.<\/p>\n<h3 id=\"mysql\">MySQL<\/h3>\n<p>MySQL is a widely used database management system that stores and organizes data for applications. It is commonly used in web and mobile systems because it is reliable and easy to use. According to Yudiastuti and Irwansyah (2024), MySQL provides efficient data storage and fast data retrieval, which improves system performance.<\/p>\n<p>MySQL also supports large-scale data management, making it suitable for systems that handle many users and transactions. It allows developers to manage data securely and efficiently. According to Hidayat et al. (2024), MySQL plays an important role in handling user data and supporting dynamic web applications.<\/p>\n<p>In addition, MySQL can be integrated with different programming languages and platforms, making it flexible for various systems. According to Oracle (2023), MySQL ensures data consistency, security, and scalability, which are important for modern applications.<\/p>\n<h2 id=\"app-development\">App Development<\/h2>\n<p>App development involves creating applications for mobile devices such as smartphones and tablets. It includes designing app interfaces, building app logic, and connecting to servers and databases, as well as building, testing, and refining apps to ensure performance, usability, and reliability. In the KASANGGA system, app development tools and languages are used to build the mobile application that allows residents to report incidents and receive emergency assistance.<\/p>\n<h3 id=\"android-studio\">Android Studio<\/h3>\n<p>Android Studio is the official integrated development environment used for building Android applications. It provides tools for coding, designing user interfaces, testing, and debugging applications in one platform. Developers use it because it simplifies the development process and supports modern technologies. According to Späth (2022), Android Studio improves productivity by offering built-in tools that help developers manage projects efficiently and create high-quality mobile applications.<\/p>\n<p>Android Studio also supports advanced features such as real-time code editing, layout design, and performance monitoring. These features help developers identify and fix errors quickly during development. According to Evidor (2023), the use of Android Studio allows developers to design interactive and responsive user interfaces, making applications more user-friendly and visually appealing.<\/p>\n<p>Furthermore, Android Studio is continuously updated to support new Android features and improve system performance. This makes it reliable for developing modern applications. According to Callan and Petke (2024), development environments like Android Studio play an important role in optimizing application performance and ensuring that mobile applications run smoothly across different devices.<\/p>\n<h3 id=\"java\">Java<\/h3>\n<p>Java is one of the most widely used programming languages in mobile and web development. It is known for its stability, portability, and ability to run on different platforms. Java is commonly used in Android development because it provides strong support for object-oriented programming. According to Liang (2022), Java helps developers build reliable and scalable applications due to its structured programming approach.<\/p>\n<p>Java is also widely used because of its large community and extensive libraries, which make development easier and faster. Developers can reuse existing code and tools, reducing development time. According to Sharma and Kumar (2023), Java remains relevant in modern development because it provides strong security features and supports large-scale applications.<\/p>\n<p>Despite the rise of newer languages, Java continues to be important in maintaining and updating existing systems. Many organizations still rely on Java-based applications. According to Callan and Petke (2024), Java plays a significant role in improving application performance and ensuring compatibility across different platforms, making it a reliable choice for developers.<\/p>\n<h3 id=\"kotlin\">Kotlin<\/h3>\n<p>Kotlin is a modern programming language used for Android development. It is officially supported by Google and is designed to be simpler and more efficient than Java. Kotlin allows developers to write less code while achieving the same functionality. According to Späth (2022), Kotlin improves code readability and reduces errors, making it easier for developers to build applications.<\/p>\n<p>Kotlin also supports modern programming features such as null safety, which helps prevent common errors in applications. This makes applications more stable and secure. According to Motshegwe (2025), Kotlin improves application performance and developer productivity because of its concise syntax and advanced features.<\/p>\n<p>In addition, Kotlin can work together with Java, allowing developers to use both languages in one project. This makes it easier to transition from Java to Kotlin. According to JetBrains (n.d.), Kotlin provides better flexibility and compatibility, making it a preferred choice for modern Android development.<\/p>\n<h2 id=\"xampp\">XAMPP<\/h2>\n<p>XAMPP is a widely used, free, and open-source software stack designed to create a local web server environment on a developer’s personal computer (Apache Friends, n.d.). It bundles essential components such as Apache, MySQL, and PHP, allowing developers to build and test web applications locally before deployment.<\/p>\n<p>In the development of the KASANGGA system, XAMPP is used to run and test the web-based admin dashboard locally, providing a local server environment for the PHP, MySQL, HTML, CSS, and JavaScript components before the system is deployed online.<\/p>\n<h2 id=\"visual-studio-code\">Visual Studio Code<\/h2>\n<p>Visual Studio Code is a lightweight and powerful code editor used for developing web and mobile applications. It supports many programming languages and provides features like extensions, debugging tools, and version control. According to Ali and Ilyas (2025), Visual Studio Code improves development efficiency because it is flexible and easy to customize based on project needs.<\/p>\n<p>Visual Studio Code is also popular because of its user-friendly interface and fast performance. Developers can easily install extensions to support different programming languages and frameworks. According to Microsoft (n.d.), the use of modern code editors like Visual Studio Code helps developers write clean and organized code, improving overall system quality.<\/p>\n<p>Moreover, Visual Studio Code supports collaboration and integration with other tools, making it suitable for team projects. According to Microsoft (n.d.), Visual Studio Code enhances productivity by providing tools that support real-time collaboration and efficient project management.<\/p>\n<h2 id=\"related-systems\">Related Systems<\/h2>\n<h3 id=\"ireportmo-an-emergency-report-android-mobile-app\">iReportMo: An Emergency Report Android Mobile Application for Metro Manila<\/h3>\n<p>The iReportMo system, developed by J. A. Maghanoy (2019), is a mobile-based emergency reporting application designed to help people report incidents such as crimes, fires, and accidents using their smartphones. The system allows users to input important details like the type of incident, time, location, and even attach images. By using Geographic Information System (GIS) technology, the app can accurately identify the location of the emergency, making it easier for authorities to respond quickly and efficiently.<\/p>\n<p>This system focuses on improving communication between citizens and emergency responders. Instead of relying only on phone calls or manual reporting, users can send complete and organized information directly through the app. As a result, emergency responders receive clearer and faster reports, which helps them take immediate action and reduce response time during critical situations.<\/p>\n<p><strong>iSafeButuan: A GPS-Enabled Android Mobile Application Enhancing Citizen-Police Collaboration for Incident Reporting and Emergency Response<\/strong><\/p>\n<p>The iSafeButuan system, developed by M. R. O. Raz et al. (2025), is a GPS-based mobile application created to strengthen the connection between citizens and law enforcement agencies. This system allows users to report emergencies in real time while automatically capturing their exact location using GPS technology. It also provides features such as locating nearby police stations and enabling direct communication with authorities.<\/p>\n<p>The main goal of this system is to improve emergency response time and ensure that help can reach users as quickly as possible. By using location tracking, authorities can easily find the exact place where the incident occurred. This reduces confusion and delays, especially during urgent situations, making the system highly useful for public safety and emergency management.<\/p>\n<p><strong>Disaster Emergency Events Application (DEAPP): Secure Cross-Layer Mobile Sensing Framework for Real-Time Disaster Reporting and Visualization Using a Mobile Application<\/strong><\/p>\n<p>The Disaster Emergency Events Application (DEAPP), developed by R. Mustafa et al. (2025), is a mobile-based system combined with a web-based dashboard for managing disaster-related incidents. Users can report emergencies in real time using the mobile app, while administrators and authorities can monitor these reports through a web system. The platform also includes features such as notifications, data visualization, and real-time updates.<\/p>\n<p>This system is designed to support better decision-making during disasters by providing organized and accessible information. Authorities can track incidents, analyze data, and respond more effectively using the web dashboard. The integration of mobile and web technologies makes the system more powerful, as it allows both users and administrators to actively participate in emergency response and management.<\/p>\n<h2 id=\"matrix-of-related-studies\">Matrix of Related Studies<\/h2>\n<p class=\"caption\">Table 1.<\/p>\n<div class=\"tablewrap\"><table>\n\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<p><strong>1.<\/strong> iReportMo: An Emergency Report Android Mobile Application for Metro Manila (J. A. Maghanoy, 2019)<\/p>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Research Method<\/strong><\/th>\n<th>Developmental Research / System Development<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Goal<\/strong><\/td>\n<td>To develop a mobile application that allows users to report emergencies such as crimes, accidents, and fires with location and media support for faster response of authorities.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Development Tool &amp; Method<\/strong><\/td>\n<td>Android (Java), GIS (Geographic Information System), Mobile Application Development<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>2.<\/strong> iSafeButuan: A GPS-Enabled Android Application Enhancing Citizen-Police Collaboration for Incident Reporting and Emergency Response (M. R. O. Raz et al., 2025)<\/p>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Research Method<\/strong><\/th>\n<th>Design and developmental research<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Goal<\/strong><\/td>\n<td>To improve communication between citizens and police by enabling real-time incident reporting with GPS location tracking for faster emergency response.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Development Tool &amp; Method<\/strong><\/td>\n<td>Android development, GPS technology, mobile communication systems, real-time reporting framework<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>3.<\/strong> Disaster Emergency Events Application (DEAPP): <em>Secure Cross-Layer Mobile Sensing Framework for Real-Time Disaster Reporting and Visualization Using a Mobile Application<\/em> (R. Mustafa et al., 2025)<\/p>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><strong>Research Method<\/strong><\/th>\n<th>Developmental Research/prototype system design<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Goal<\/strong><\/td>\n<td>To create a mobile and web-based platform for real-time disaster reporting, monitoring, and visualization to support emergency decision-making.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Development Tool &amp; Method<\/strong><\/td>\n<td>Mobile application development, web-based dashboard, real-time database system, data visualization tools<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"synthesis\">Synthesis<\/h2>\n<p>The reviewed studies show that mobile-based reporting systems improve communication between users and authorities by allowing faster and more organized submission of incident reports. The study of iReportMo developed by J. A. Maghanoy (2019) presents a mobile application that enables users to report incidents such as crimes and emergencies by providing details like description, time, and location. This helps authorities respond more efficiently based on the information received.<\/p>\n<p>Another related system is iSafeButuan developed by M. R. O. Raz et al. (2025), which uses GPS technology to assist in identifying the location of reported incidents. This feature helps authorities verify and locate incidents more easily, improving response coordination. In addition, the Disaster Emergency Events Application (DEAPP) developed by R. Mustafa et al. (2025) integrates a mobile application with a web-based dashboard that allows users to submit reports while administrators monitor and manage data in real time.<\/p>\n<p>Overall, these systems demonstrate that mobile reporting and centralized monitoring are important in improving communication and coordination in incident reporting systems. However, most of these systems focus on general emergencies and disaster-related incidents and do not specifically address Violence Against Women and Children (VAWC) cases. They also lack localized validation processes and community-based reporting workflows.<\/p>\n<p>Because of these gaps, the proposed KASANGGA system focuses on improving VAWC reporting by providing structured incident submission, report validation through barangay officials, records management, and a web-based dashboard for MSWDO and barangay monitoring.<\/p>\n<h2 id=\"prior-art\">Prior Art<\/h2>\n<p>The most closely related study to the proposed KASANGGA system is iReportMo developed by J. A. Maghanoy (2019). This system is a mobile-based application that allows users to report emergency incidents such as crimes, fires, and accidents using smartphones. It enables users to submit important details including the description, time, and location of the incident. The system aims to improve the speed and accuracy of emergency reporting by allowing direct communication between users and authorities.<\/p>\n<p>iReportMo is considered the closest prior art because it shares similarities with the proposed KASANGGA system in terms of mobile-based reporting and structured incident submission. However, iReportMo is designed for general emergencies and does not focus on Violence Against Women and Children (VAWC) cases.<\/p>\n<p>In contrast, the proposed KASANGGA system is specifically designed for VAWC reporting and includes a validation process handled by barangay officials and MSWDO personnel. It also includes features such as records retrieval and a centralized dashboard to support proper monitoring and management of sensitive cases at the community level.<\/p>\n<h2 id=\"summary\">Summary<\/h2>\n<p>The reviewed systems show that mobile-based incident reporting applications improve the accessibility and efficiency of reporting by allowing users to easily submit incident details to authorities. The iReportMo system developed by J. A. Maghanoy (2019) simplifies reporting by allowing users to send incident information such as description and location. The iSafeButuan system developed by M. R. O. Raz et al. (2025) enhances reporting by supporting location-based identification of incidents, while the DEAPP system developed by R. Mustafa et al. (2025) integrates mobile and web platforms for monitoring and managing reports.<\/p>\n<p>Despite these improvements, most existing systems focus on general emergencies and disaster-related incidents and do not specifically address Violence Against Women and Children (VAWC) reporting. They also lack structured validation processes and localized community-level handling of sensitive cases.<\/p>\n<p>To address these limitations, the proposed KASANGGA system focuses on VAWC reporting at the barangay level, providing structured incident submission, validation through barangay officials, records retrieval, hotline access, and Lumi, a chatbot that communicates in Kinaray-a, Tagalog, and English, for user guidance. This improves accessibility, communication, and coordination between residents, barangay officials, and MSWDO in handling VAWC cases effectively.<\/p>\n"}, {"id": "ch3", "label": "Chapter III", "subtitle": "Methodology", "sections": [{"id": "research-design", "title": "Research Design", "level": 2}, {"id": "system-development-life-cycle-agile-methodology", "title": "System Development Life Cycle – Agile Methodology", "level": 2}, {"id": "phase-one-requirements-gathering", "title": "Phase One: Requirements Gathering", "level": 3}, {"id": "phase-two-analysis", "title": "Phase Two: Analysis", "level": 3}, {"id": "phase-three-design", "title": "Phase Three: Design", "level": 3}, {"id": "phase-four-coding", "title": "Phase Four: Coding", "level": 3}, {"id": "web-based-admin-dashboard-development", "title": "Web-Based Admin Dashboard Development", "level": 3}, {"id": "phase-five-testing", "title": "Phase Five: Testing", "level": 3}, {"id": "phase-six-delivery-of-partially-incremented-soft", "title": "Phase Six: Delivery of Partially Incremented Software", "level": 3}, {"id": "phase-seven-feedback-from-user", "title": "Phase Seven: Feedback from User", "level": 3}, {"id": "locale-of-the-study", "title": "Locale of the Study", "level": 2}, {"id": "sampling-technique", "title": "Sampling Technique", "level": 2}, {"id": "respondents-of-the-study", "title": "Respondents of the study", "level": 2}, {"id": "research-instrument", "title": "Research Instrument", "level": 2}, {"id": "data-gathering-procedure", "title": "Data Gathering Procedure", "level": 2}, {"id": "data-analysis-procedure", "title": "Data Analysis Procedure", "level": 2}, {"id": "sus-formula", "title": "SUS Formula:", "level": 4}], "html": "\n\n<p>This chapter presents the following: (1) Research Design, (2) Software Development Life Cycle – Agile Methodology, (3) Locale of the Study, (4) Sampling Technique, (5) Respondents of the Study, (6) Research Instrument, (7) Data Gathering Procedure, and (8) Data Analysis Procedure.<\/p>\n<h2 id=\"research-design\">Research Design<\/h2>\n<p>This study employed a descriptive-developmental research design<strong>.<\/strong> The descriptive method was used to systematically describe and evaluate the usability of the developed KASANGGA system without manipulating any variables. It focused on assessing the system based on user experience, particularly in terms of ease of use, efficiency, and user satisfaction. This method helped determine whether the system met the needs of its intended users, including residents, barangay officials, and Municipal Social Welfare and Development Office (MSWDO) personnel.<\/p>\n<p>On the other hand, the developmental method was applied throughout the system development process. This method focuses on the design, creation, and improvement of the KASANGGA system to ensure that it effectively addresses the needs of Violence Against Women and Children (VAWC) reporting. It involves the planning, analysis, design, development, testing, and evaluation of the system using an iterative approach.<\/p>\n<p>During the planning and analysis phase, problems related to VAWC reporting were identified, user needs were determined, and the system requirements of the mobile application and web-based dashboard were established. This phase ensures that the system is properly designed based on real community needs before development begins.<\/p>\n<p>The combination of descriptive and developmental research methods supports understanding the existing problems in VAWC reporting while systematically developing a functional system that addresses these issues through an organized and user-friendly platform.<\/p>\n<h2 id=\"system-development-life-cycle-agile-methodology\">System Development Life Cycle – Agile Methodology<\/h2>\n<p>The study utilized the Agile Software Development Life Cycle (SDLC) as the framework for developing the KASANGGA system. Agile is an iterative and flexible development approach that emphasizes continuous improvement, user feedback, and collaboration. This methodology is appropriate for emergency reporting systems due to their need for adaptability and continuous enhancement. The Agile development process consists of the following phases: requirements gathering, analysis, design, coding, testing, delivery of partially incremented software, and feedback from users. The Agile Development consists of the following phases:<\/p>\n<h3 id=\"phase-one-requirements-gathering\">Phase One: Requirements Gathering<\/h3>\n<p>At the beginning of this phase, formal approval was sought from the appropriate authorities, such as the Program Chair or Dean, to conduct the study titled KASANGGA: A Mobile-Based Violence Against Women and Children (VAWC) Repo
