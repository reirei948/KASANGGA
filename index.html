n", "level": 3}, {"id": "4-using-the-homepage", "title": "4. Using the Homepage", "level": 3}, {"id": "5-reporting-a-vawc-incident", "title": "5. Reporting a VAWC Incident", "level": 3}, {"id": "6-calling-or-texting-barangay-officials", "title": "6. Calling or Texting Barangay Officials", "level": 3}, {"id": "7-checking-the-status-of-your-reports", "title": "7. Checking the Status of Your Reports", "level": 3}, {"id": "8-reading-about-vawc-laws", "title": "8. Reading About VAWC Laws", "level": 3}, {"id": "9-chatting-with-lumi", "title": "9. Chatting with Lumi", "level": 3}, {"id": "10-playing-the-learn-play-games", "title": "10. Playing the Learn & Play Games", "level": 3}, {"id": "11-updating-your-profile-and-logging-out", "title": "11. Updating Your Profile and Logging Out", "level": 3}, {"id": "appendix-b-communication-letters", "title": "Appendix B · Communication Letters", "level": 2}, {"id": "appendix-c-work-breakdown-structure", "title": "Appendix C · Work Breakdown Structure", "level": 2}, {"id": "appendix-d-activity-diagram", "title": "Appendix D · Activity Diagram", "level": 2}, {"id": "appendix-e-use-case-diagram", "title": "Appendix E · Use Case Diagram", "level": 2}, {"id": "appendix-f-flowchart", "title": "Appendix F · Flowchart", "level": 2}, {"id": "appendix-g-weekly-deliverables", "title": "Appendix G · Weekly Deliverables", "level": 2}, {"id": "week-1-70", "title": "Week 1: 70%", "level": 3}, {"id": "week-2-20", "title": "Week 2: 20%", "level": 3}, {"id": "week-3-10", "title": "Week 3: 10%", "level": 3}, {"id": "appendix-h-kasangga-prototype", "title": "Appendix H · KASANGGA Prototype", "level": 2}, {"id": "kasangga-prototype", "title": "KASANGGA Prototype", "level": 3}, {"id": "appendix-i-quality-assurance-test-cases", "title": "Appendix I · Quality Assurance Test Cases", "level": 2}, {"id": "test-case-version-1", "title": "TEST CASE VERSION 1", "level": 3}, {"id": "test-case-index", "title": "Test Case Index", "level": 3}, {"id": "appendix-j-quality-assurance-test-logs", "title": "Appendix J · Quality Assurance Test Logs", "level": 2}, {"id": "appendix-k-research-instrument", "title": "Appendix K · Research Instrument", "level": 2}, {"id": "system-usability-scale-sus-questionnaire", "title": "System Usability Scale (SUS) Questionnaire", "level": 3}, {"id": "appendix-l-documentation", "title": "Appendix L · Documentation", "level": 2}, {"id": "appendix-m-minutes-of-the-meeting", "title": "Appendix M · Minutes of the Meeting", "level": 2}, {"id": "agenda", "title": "Agenda:", "level": 3}, {"id": "discussion", "title": "Discussion:", "level": 3}, {"id": "minutes-of-the-meeting", "title": "Minutes of the Meeting", "level": 3}, {"id": "agenda-2", "title": "Agenda:", "level": 3}, {"id": "discussion-2", "title": "Discussion:", "level": 3}, {"id": "next-steps", "title": "Next Steps:", "level": 3}, {"id": "appendix-n", "title": "Appendix N · Curriculum Vitae", "level": 2}], "html": "\n<h2 id=\"appendix-a-user-s-manual\">Appendix A · User’s Manual<\/h2>\n\n<p>FOR SUPER ADMIN<\/p>\n<p>This manual guides the Super Admin of the Municipal Social Welfare and Development Office (MSWDO) in using the KASANGGA web-based Super Admin Dashboard. The Super Admin monitors the VAWC reports of all 28 barangays of San Enrique, keeps the barangay contacts updated, and manages the user and admin accounts of the system.<\/p>\n<h3 id=\"what-you-need\">What You Need<\/h3>\n<blockquote>\n<p>• A computer, laptop, or phone with a web browser such as Google Chrome<\/p>\n<p>• An internet connection<\/p>\n<p>• A Super Admin account (email and password)<\/p>\n<p>• The KASANGGA server running (Apache and MySQL started in XAMPP)<\/p>\n<\/blockquote>\n<h3 id=\"1-signing-in\">1. Signing In<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m065.jpg\" width=\"1342\"/><\/figure>\n<p><em>Super Admin Login page<\/em><\/p>\n<blockquote>\n<p>1. Open the web browser and go to the KASANGGA Super Admin Login page (super_admin_login.html).<\/p>\n<p>2. Type your email address in the <strong>Super Admin Email<\/strong> field.<\/p>\n<p>3. Type your password in the <strong>Password<\/strong> field. Click the eye icon if you want to see what you typed.<\/p>\n<p>4. Click <strong>Sign In<\/strong>. The Super Admin Dashboard will open.<\/p>\n<p><strong>Note:<\/strong> If you opened the wrong page, click <strong>Signing in as Admin?<\/strong> to go to the Barangay Admin login page.<\/p>\n<\/blockquote>\n<h3 id=\"2-viewing-the-overview\">2. Viewing the Overview<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m066.jpg\" width=\"1342\"/><\/figure>\n<p><em>Overview page<\/em><\/p>\n<blockquote>\n<p>1. After signing in, the <strong>Overview<\/strong> page opens first. You can also click <strong>Overview<\/strong> in the sidebar.<\/p>\n<p>2. Check the four boxes at the top for the Total Reports, Awaiting Verification, In Verification, and Resolved reports.<\/p>\n<p>3. Use the charts to see the number of reports per day, the barangays with the most reports, and the types of incidents reported.<\/p>\n<\/blockquote>\n<h3 id=\"3-monitoring-vawc-reports\">3. Monitoring VAWC Reports<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m067.jpg\" width=\"1342\"/><\/figure>\n<p><em>VAWC Reports page<\/em><\/p>\n<blockquote>\n<p>1. Click <strong>Reports<\/strong> in the sidebar to see all the reports sent through the mobile application.<\/p>\n<p>2. To find a report, type the reporter’s name, barangay, or a word from the description in the search bar.<\/p>\n<p>3. To show only one kind of report, choose a status (Pending, Contacted, Validated, Rejected, or Resolved) from the <strong>All statuses<\/strong> dropdown.<\/p>\n<p>4. Click <strong>View<\/strong> on a report to open its details.<\/p>\n<\/blockquote>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m068.jpg\" width=\"1342\"/><\/figure>\n<p><em>Report Details window<\/em><\/p>\n<blockquote>\n<p>5. Read the incident type, date, reporter’s details, description, status, and the <strong>Call Log / Admin Notes<\/strong> written by the Barangay Admin.<\/p>\n<p>6. Click <strong>Close<\/strong> to go back to the list.<\/p>\n<p>7. Only if a report must be removed for good (for example, a fake or duplicate report), click <strong>Delete Report Permanently<\/strong>, then click <strong>OK<\/strong> to confirm.<\/p>\n<p><strong>Note:<\/strong> The Super Admin can only view the reports. Calling the reporter and changing the status of a report are done by the Barangay Admin. A deleted report cannot be recovered.<\/p>\n<\/blockquote>\n<h3 id=\"4-downloading-the-list-of-reports\">4. Downloading the List of Reports<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m069.jpg\" width=\"1342\"/><\/figure>\n<p><em>Retrieve Data options<\/em><\/p>\n<blockquote>\n<p>1. On the Reports page, filter or search the list first if you only need certain reports.<\/p>\n<p>2. Click <strong>Retrieve Data<\/strong>.<\/p>\n<p>3. Click <strong>Download All as CSV<\/strong> to save the list as a spreadsheet file, or click <strong>Print / Save as PDF<\/strong> to print it or save it as a PDF file.<\/p>\n<\/blockquote>\n<h3 id=\"5-editing-barangay-contacts\">5. Editing Barangay Contacts<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m070.jpg\" width=\"1342\"/><\/figure>\n<p><em>Barangay Contacts page (Super Admin)<\/em><\/p>\n<blockquote>\n<p>1. Click <strong>Barangay Contacts<\/strong> in the sidebar.<\/p>\n<p>2. Find the barangay you want to update.<\/p>\n<p>3. Type the new name or number of the Barangay Captain or VAWC Desk Officer in the fields.<\/p>\n<p>4. Click <strong>Save<\/strong> on that row. The new contact will also show in the Contacts tab of the mobile application.<\/p>\n<\/blockquote>\n<h3 id=\"6-managing-registered-users\">6. Managing Registered Users<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m071.jpg\" width=\"1342\"/><\/figure>\n<p><em>Registered Users page (Super Admin)<\/em><\/p>\n<blockquote>\n<p>1. Click <strong>Registered Users<\/strong> in the sidebar to see the residents who created an account in the mobile application.<\/p>\n<p>2. Type a name, phone number, or barangay in the search bar to find a user.<\/p>\n<p>3. To remove a fake or mistaken account, click <strong>Delete<\/strong> on that row, then click <strong>OK<\/strong> to confirm.<\/p>\n<\/blockquote>\n<h3 id=\"7-managing-admin-accounts\">7. Managing Admin Accounts<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media1/m072.jpg\" width=\"1342\"/><\/figure>\n<p><em>Admin Accounts page<\/em><\/p>\n<blockquote>\n<p>1. Click <strong>Admin Accounts<\/strong> in the sidebar to see everyone who can sign in to the dashboards.<\/p>\n<p>2. To stop an admin from signing in, click <strong>Deactivate<\/strong> on that row. To allow the account again, click <strong>Reactivate<\/strong>.<\/p>\n<p>3. To add a new admin, click <strong>+ Add Admin<\/strong> at the upper right.<\/p>\n<\/blockquote>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media2/m073.jpg\" width=\"1342\"/><\/figure>\n<p><em>Add Admin form<\/em><\/p>\n<blockquote>\n<p>4. Type the new admin’s <strong>Email<\/strong>.<\/p>\n<p>5. Type a <strong>Password<\/strong> with at least eight characters.<\/p>\n<p>6. Choose the <strong>Role<\/strong>: Admin for barangay officials, or Super Admin for MSWDO personnel.<\/p>\n<p>7. Click <strong>Create Admin<\/strong>. Give the email and password to the new admin so they can sign in.<\/p>\n<p><strong>Note:<\/strong> Your own account is marked “(you)” and cannot be deactivated.<\/p>\n<\/blockquote>\n<h3 id=\"8-signing-out\">8. Signing Out<\/h3>\n<blockquote>\n<p>1. Click <strong>Sign Out<\/strong> at the bottom of the sidebar when you are done.<\/p>\n<p>2. Close the browser if you are using a shared computer.<\/p>\n<\/blockquote>\n<h3 id=\"user-s-manual\">User’s Manual<\/h3>\n<p>FOR BARANGAY ADMIN<\/p>\n<p>This manual guides the Barangay Admins, such as the Barangay Captain and the VAWC Desk Officer, in using the KASANGGA web-based Admin Dashboard. Barangay Admins receive the reports sent by residents, call the reporter to verify the case, update the status of the report, and write call notes.<\/p>\n<h3 id=\"what-you-need-2\">What You Need<\/h3>\n<blockquote>\n<p>• A computer, laptop, or phone with a web browser such as Google Chrome<\/p>\n<p>• An internet connection<\/p>\n<p>• An Admin account (email and password) given by the Super Admin<\/p>\n<p>• The KASANGGA server running (Apache and MySQL started in XAMPP)<\/p>\n<\/blockquote>\n<h3 id=\"1-signing-in-2\">1. Signing In<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media2/m074.jpg\" width=\"1342\"/><\/figure>\n<p><em>Admin Login page<\/em><\/p>\n<blockquote>\n<p>1. Open the web browser and go to the KASANGGA Admin Login page (admin_login.html).<\/p>\n<p>2. Type your email address in the <strong>Admin Email<\/strong> field.<\/p>\n<p>3. Type your password in the <strong>Password<\/strong> field. Click the eye icon if you want to see what you typed.<\/p>\n<p>4. Click <strong>Sign In<\/strong>. The Admin Dashboard will open.<\/p>\n<p><strong>Note:<\/strong> If you do not have an account yet, ask the Super Admin of the MSWDO to create one for you.<\/p>\n<\/blockquote>\n<h3 id=\"2-viewing-the-analytics\">2. Viewing the Analytics<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media2/m075.jpg\" width=\"1342\"/><\/figure>\n<p><em>Analytics page<\/em><\/p>\n<blockquote>\n<p>1. After signing in, the <strong>Analytics<\/strong> page opens first. You can also click <strong>Analytics<\/strong> in the sidebar.<\/p>\n<p>2. Check the four boxes at the top for the Total Reports, Awaiting Verification, In Verification, and Resolved reports.<\/p>\n<p>3. Use the charts to see the number of reports per day, the barangays with the most reports, and the types of incidents reported.<\/p>\n<\/blockquote>\n<h3 id=\"3-managing-vawc-reports\">3. Managing VAWC Reports<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media2/m076.jpg\" width=\"1342\"/><\/figure>\n<p><em>VAWC Reports page<\/em><\/p>\n<blockquote>\n<p>1. Click <strong>Reports<\/strong> in the sidebar. The number beside it shows how many reports there are.<\/p>\n<p>2. To find a report, type the reporter’s name, barangay, or a word from the description in the search bar, or choose a status from the <strong>All statuses<\/strong> dropdown.<\/p>\n<p>3. Click <strong>Manage<\/strong> on the report you want to handle.<\/p>\n<\/blockquote>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media2/m077.jpg\" width=\"1342\"/><\/figure>\n<p><em>Manage Report window<\/em><\/p>\n<blockquote>\n<p>4. Read the details of the report, then call the reporter using the phone number shown to verify the incident.<\/p>\n<p>5. Choose the new <strong>Status<\/strong> of the report.<\/p>\n<p>6. In the <strong>Call Log / Admin Notes<\/strong> box, write what happened during the call, for example, “Called reporter at 2:40 PM, confirmed incident, escalating to barangay captain.”<\/p>\n<p>7. Click <strong>Save Changes<\/strong>. Click <strong>Cancel<\/strong> if you want to close the window without saving.<\/p>\n<p><strong>Meaning of each status:<\/strong><\/p>\n<p>• <strong>Pending<\/strong> – the report was received and no one has acted on it yet.<\/p>\n<p>• <strong>Contacted<\/strong> – the admin has called the reporter.<\/p>\n<p>• <strong>Validated<\/strong> – the incident was confirmed after verifying it with the reporter.<\/p>\n<p>• <strong>Rejected<\/strong> – the report was found to be false or invalid.<\/p>\n<p>• <strong>Resolved<\/strong> – the case has been acted upon and closed.<\/p>\n<p><strong>Note:<\/strong> The resident sees the new status in the Reports tab of the mobile application. Keep the details of every report private.<\/p>\n<\/blockquote>\n<h3 id=\"4-downloading-the-list-of-reports-2\">4. Downloading the List of Reports<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media2/m078.jpg\" width=\"1342\"/><\/figure>\n<p><em>Retrieve Data options<\/em><\/p>\n<blockquote>\n<p>1. On the Reports page, filter or search the list first if you only need certain reports.<\/p>\n<p>2. Click <strong>Retrieve Data<\/strong>.<\/p>\n<p>3. Click <strong>Download All as CSV<\/strong> to save the list as a spreadsheet file, or click <strong>Print / Save as PDF<\/strong> to print it or save it as a PDF file.<\/p>\n<\/blockquote>\n<h3 id=\"5-viewing-barangay-contacts\">5. Viewing Barangay Contacts<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media2/m079.jpg\" width=\"1342\"/><\/figure>\n<p><em>Barangay Contacts page (Admin)<\/em><\/p>\n<blockquote>\n<p>1. Click <strong>Barangay Contacts<\/strong> in the sidebar to see the Barangay Captain and VAWC Desk Officer of the 28 barangays.<\/p>\n<p>2. If a name or number is wrong or has changed, inform the Super Admin, since only the Super Admin can edit the contacts.<\/p>\n<\/blockquote>\n<h3 id=\"6-viewing-registered-users\">6. Viewing Registered Users<\/h3>\n<figure class=\"fig\"><img alt=\"\" height=\"618\" loading=\"lazy\" src=\"media2/m080.jpg\" width=\"1342\"/><\/figure>\n<p><em>Registered Users page (Admin)<\/em><\/p>\n<blockquote>\n<p>1. Click <strong>Registered Users<\/strong> in the sidebar to see the residents who created an account in the mobile application.<\/p>\n<p>2. Type a name, phone number, or barangay in the search bar to find a user.<\/p>\n<\/blockquote>\n<h3 id=\"7-signing-out\">7. Signing Out<\/h3>\n<blockquote>\n<p>1. Click <strong>Sign Out<\/strong> at the bottom of the sidebar when you are done.<\/p>\n<p>2. Close the browser if you are using a shared computer.<\/p>\n<\/blockquote>\n<h3 id=\"user-s-manual-2\">User’s Manual<\/h3>\n<p>FOR RESIDENTS (MOBILE APPLICATION)<\/p>\n<p>This manual guides the residents of San Enrique, Iloilo in using the KASANGGA mobile application. With the app, residents can report a VAWC incident, call or text their barangay officials, check the status of their reports, learn about VAWC laws, talk with Lumi, and play the Learn &amp; Play games.<\/p>\n<h3 id=\"what-you-need-3\">What You Need<\/h3>\n<blockquote>\n<p>• An Android phone<\/p>\n<p>• An internet connection (Wi-Fi or mobile data)<\/p>\n<p>• The KASANGGA app installed on the phone<\/p>\n<\/blockquote>\n<h3 id=\"1-installing-the-app\">1. Installing the App<\/h3>\n<blockquote>\n<p>1. Get the KASANGGA.apk installer file from the researchers or your barangay.<\/p>\n<p>2. Open the file on your phone and tap <strong>Install<\/strong>. If your phone asks, allow installing apps from this source.<\/p>\n<p>3. After installing, tap the KASANGGA icon to open the app.<\/p>\n<\/blockquote>\n<h3 id=\"2-creating-an-account\">2. Creating an Account<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"2050\" loading=\"lazy\" src=\"media2/m081.jpg\" width=\"900\"/><\/figure>\n<p><em>Registration screen<\/em><\/p><\/th>\n<th><p>1. On the login screen, tap <strong>Sign Up<\/strong>.<\/p>\n<p>2. Type your full name.<\/p>\n<p>3. Type your mobile number.<\/p>\n<p>4. Choose your barangay from the list.<\/p>\n<p>5. Type your password, then type it again to confirm.<\/p>\n<p>6. Tap <strong>Create Account<\/strong>.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>Note:<\/strong> One mobile number can only be used for one account.<\/p>\n<\/blockquote>\n<h3 id=\"3-logging-in\">3. Logging In<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"2050\" loading=\"lazy\" src=\"media2/m082.jpg\" width=\"900\"/><\/figure>\n<p><em>Login screen<\/em><\/p><\/th>\n<th><p>1. Type your registered mobile number.<\/p>\n<p>2. Type your password. Tap the eye icon if you want to see what you typed.<\/p>\n<p>3. Tap <strong>Login<\/strong>. The Homepage will open.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"4-using-the-homepage\">4. Using the Homepage<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media2/m083.jpg\" width=\"720\"/><\/figure>\n<p><em>Homepage<\/em><\/p><\/th>\n<th><p>1. Your name and barangay are shown at the top.<\/p>\n<p>2. Tap <strong>REPORT AN INCIDENT<\/strong> to send a report.<\/p>\n<p>3. Tap the round robot button at the lower right to chat with Lumi.<\/p>\n<p>4. Scroll down and tap <strong>Learn &amp; Play<\/strong> to play the games.<\/p>\n<p>5. Use the buttons at the bottom to go to the Home, Contacts, Reports, Laws, and Profile tabs.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"5-reporting-a-vawc-incident\">5. Reporting a VAWC Incident<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"1284\" loading=\"lazy\" src=\"media2/m084.jpg\" width=\"720\"/><\/figure>\n<p><em>Submit a Report screen<\/em><\/p><\/th>\n<th><p>1. On the Homepage, tap <strong>REPORT AN INCIDENT<\/strong>.<\/p>\n<p>2. Choose the <strong>Type of Incident<\/strong>, such as Physical Abuse.<\/p>\n<p>3. Choose the <strong>Barangay<\/strong> where it happened.<\/p>\n<p>4. If you have proof, tap <strong>Add Photo or Video<\/strong> to attach up to five photos or videos. This is optional.<\/p>\n<p>5. In the <strong>Description<\/strong>, write what happened in your own words.<\/p>\n<p>6. Tap <strong>Submit Report<\/strong>. Your report will appear in the Reports tab with a Pending status.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>Note:<\/strong> Your report can only be seen by the authorized barangay and MSWDO admins. If you are in immediate danger, call your barangay officials first using the Contacts tab.<\/p>\n<\/blockquote>\n<h3 id=\"6-calling-or-texting-barangay-officials\">6. Calling or Texting Barangay Officials<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media2/m085.jpg\" width=\"720\"/><\/figure>\n<p><em>Contacts screen<\/em><\/p><\/th>\n<th><p>1. Tap <strong>Contacts<\/strong> at the bottom of the screen.<\/p>\n<p>2. Type your barangay or the name of the official in the search bar.<\/p>\n<p>3. Tap the phone button to call, or the message button to send a text message.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"7-checking-the-status-of-your-reports\">7. Checking the Status of Your Reports<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media2/m086.jpg\" width=\"720\"/><\/figure>\n<p><em>Reports screen<\/em><\/p><\/th>\n<th><p>1. Tap <strong>Reports<\/strong> at the bottom of the screen.<\/p>\n<p>2. The boxes at the top show your Total, Pending, and Resolved reports.<\/p>\n<p>3. Tap a filter button (All Reports, Pending, Contacted, Validated, Rejected, or Resolved) to show only those reports.<\/p>\n<p>4. Tap <strong>View Full report<\/strong> to see the complete details of a report.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>Note:<\/strong> The status of your report changes when the barangay admin acts on it. Contacted means the admin has called you, Validated means the incident was confirmed, and Resolved means the case has been acted upon.<\/p>\n<\/blockquote>\n<h3 id=\"8-reading-about-vawc-laws\">8. Reading About VAWC Laws<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media2/m087.jpg\" width=\"720\"/><\/figure>\n<p><em>Laws screen<\/em><\/p><\/th>\n<th><p>1. Tap <strong>Laws<\/strong> at the bottom of the screen.<\/p>\n<p>2. Search for a law, or tap <strong>All<\/strong>, <strong>Women<\/strong>, or <strong>Child<\/strong> to show only those laws.<\/p>\n<p>3. Tap <strong>EN<\/strong> or <strong>Filipino<\/strong> to choose the language of the explanations.<\/p>\n<p>4. Tap <strong>Read More<\/strong> on a law to see its full details.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><figure class=\"fig\"><img alt=\"\" height=\"1470\" loading=\"lazy\" src=\"media2/m088.jpg\" width=\"640\"/><\/figure>\n<p><em>Law Details screen<\/em><\/p><\/td>\n<td><p>5. Read the simple explanation, the real-life example, and the full legal description of the law.<\/p>\n<p>6. Tap <strong>CLOSE<\/strong> to go back to the list of laws.<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"9-chatting-with-lumi\">9. Chatting with Lumi<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"948\" loading=\"lazy\" src=\"media2/m089.jpg\" width=\"720\"/><\/figure>\n<p><em>Lumi chat screen<\/em><\/p><\/th>\n<th><p>1. On the Homepage, tap the round robot button.<\/p>\n<p>2. Type your question in the <strong>Type a message<\/strong> box. You can use Kinaray-a, Tagalog, or English.<\/p>\n<p>3. Tap the send button. Lumi will reply in the same language.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>Note:<\/strong> Lumi can guide you in reporting and answer common questions about VAWC, but it cannot send help. In an emergency, call your barangay officials right away.<\/p>\n<\/blockquote>\n<h3 id=\"10-playing-the-learn-play-games\">10. Playing the Learn &amp; Play Games<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"704\" loading=\"lazy\" src=\"media2/m090.jpg\" width=\"720\"/><\/figure>\n<p><em>Games Hub<\/em><\/p><\/th>\n<th><p>1. On the Homepage, scroll down and tap <strong>Learn &amp; Play<\/strong>.<\/p>\n<p>2. Tap <strong>Trivia Quiz<\/strong> or <strong>4 Pics, 1 Word<\/strong> to start a game.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><figure class=\"fig\"><img alt=\"\" height=\"1084\" loading=\"lazy\" src=\"media2/m091.jpg\" width=\"720\"/><\/figure>\n<p><em>Trivia Quiz<\/em><\/p><\/td>\n<td>3. In the Trivia Quiz, read the question and tap the answer you think is correct before the timer runs out. There are ten questions.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><figure class=\"fig\"><img alt=\"\" height=\"1104\" loading=\"lazy\" src=\"media2/m092.jpg\" width=\"720\"/><\/figure>\n<p><em>4 Pics, 1 Word<\/em><\/p><\/td>\n<td><p>4. In 4 Pics, 1 Word, look at the four pictures and the category clue, then tap the letters to spell the answer.<\/p>\n<p>5. Tap <strong>HINT<\/strong> if you get stuck.<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"11-updating-your-profile-and-logging-out\">11. Updating Your Profile and Logging Out<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media2/m093.jpg\" width=\"720\"/><\/figure>\n<p><em>Profile screen<\/em><\/p><\/th>\n<th><p>1. Tap <strong>Profile<\/strong> at the bottom of the screen.<\/p>\n<p>2. Edit your Full Name, Address/Barangay, or Contact Number if needed.<\/p>\n<p>3. Tap <strong>Save Changes<\/strong>.<\/p>\n<p>4. To sign out, tap <strong>Logout Account<\/strong>.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"appendix-b-communication-letters\">Appendix B · Communication Letters<\/h2>\n\n<p>Letter of Permission to Conduct the Study (Campus Administrator)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1976\" loading=\"lazy\" src=\"media2/m094.jpg\" width=\"1400\"/><\/figure>\n<p>Letter of Permission to Conduct the Study (Municipal Mayor of San Enrique – Received Copy)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1964\" loading=\"lazy\" src=\"media2/m095.jpg\" width=\"1400\"/><\/figure>\n<p>Letter of Permission to Conduct the Study (Municipal Mayor of San Enrique – Approved Copy)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1964\" loading=\"lazy\" src=\"media2/m096.jpg\" width=\"1400\"/><\/figure>\n<p>Letter Requesting Quality Assurance (QA) Testing<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"2141\" loading=\"lazy\" src=\"media2/m097.jpg\" width=\"1400\"/><\/figure>\n<h2 id=\"appendix-c-work-breakdown-structure\">Appendix C · Work Breakdown Structure<\/h2>\n\n<figure class=\"fig\"><img alt=\"\" height=\"768\" loading=\"lazy\" src=\"media2/m098.jpg\" width=\"1376\"/><\/figure>\n<h2 id=\"appendix-d-activity-diagram\">Appendix D · Activity Diagram<\/h2>\n\n<p>Activity Diagram for the Resident (Mobile Application)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1831\" loading=\"lazy\" src=\"media2/m099.jpg\" width=\"1400\"/><\/figure>\n<p>Activity Diagram for the Barangay Admin (Web-Based Dashboard)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1998\" loading=\"lazy\" src=\"media2/m100.jpg\" width=\"1400\"/><\/figure>\n<p>Activity Diagram for the Super Admin (Web-Based Dashboard)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1821\" loading=\"lazy\" src=\"media2/m101.jpg\" width=\"1400\"/><\/figure>\n<h2 id=\"appendix-e-use-case-diagram\">Appendix E · Use Case Diagram<\/h2>\n\n<p>Use Case Diagram of the KASANGGA Mobile Application (Resident)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1198\" loading=\"lazy\" src=\"media2/m102.jpg\" width=\"1400\"/><\/figure>\n<p>Use Case Diagram of the KASANGGA Web-Based Admin Dashboard (Barangay Admin and Super Admin)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1292\" loading=\"lazy\" src=\"media2/m103.jpg\" width=\"1400\"/><\/figure>\n<h2 id=\"appendix-f-flowchart\">Appendix F · Flowchart<\/h2>\n\n<p>Flowchart for the Resident (Mobile Application)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1557\" loading=\"lazy\" src=\"media2/m104.jpg\" width=\"1400\"/><\/figure>\n<p>Flowchart for the Barangay Admin (Web-Based Dashboard)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1791\" loading=\"lazy\" src=\"media2/m105.jpg\" width=\"1400\"/><\/figure>\n<p>Flowchart for the Super Admin (Web-Based Dashboard)<\/p>\n<figure class=\"fig\"><img alt=\"\" height=\"1222\" loading=\"lazy\" src=\"media2/m106.jpg\" width=\"1400\"/><\/figure>\n<h2 id=\"appendix-g-weekly-deliverables\">Appendix G · Weekly Deliverables<\/h2>\n\n<p><strong>Capstone Project Title:<\/strong> KASANGGA: A Mobile-Based Violence Against Women and Children (VAWC) Reporting and Assistance System with Web-Based Admin Dashboard<\/p>\n<p><strong>Project Members:<\/strong> Rhea Serquillos, William Cepriano, Kizaih Devecais, &amp; Rhea Mae Porcal<\/p>\n<h3 id=\"week-1-70\">Week 1: 70%<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th rowspan=\"2\"><strong>Tasks/Deliverables<\/strong><\/th>\n<th rowspan=\"2\"><strong>Timeline<\/strong><\/th>\n<th rowspan=\"2\"><strong>Person Responsible<\/strong><\/th>\n<th colspan=\"2\"><strong>Remarks<\/strong><\/th>\n<\/tr>\n<tr class=\"odd\">\n<th><strong>Delivered<\/strong><\/th>\n<th><strong>Not Delivered<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><p><strong><u>Mobile Application (KASANGGA — Android):<\/u><\/strong><\/p>\n<p>• Designed the animated splash screen with app branding and automatic session-based routing (returning users skip straight to Home; logged-out users go to Login).<\/p>\n<p>• Built the user registration screen with field validation, duplicate-account prevention, and in-app Privacy Policy &amp; Terms of Use dialogs.<\/p>\n<p>• Built the login screen and session handling, with hashed password storage and \"Remember Me\" auto-login.<\/p>\n<p>• Built the main Home dashboard with bottom navigation across Home, Contacts, Data, Laws, and Profile tabs.<\/p>\n<p>• Integrated \"Lumi\", an AI chatbot powered by the Google Gemini API, with a custom support system prompt and Hiligaynon/Tagalog/English responses.<\/p>\n<p>• Built the incident report submission flow: incident type selection, barangay auto-fill, description, and photo/video evidence attachment (up to 5 files).<\/p>\n<p>• Built the \"My Reports\" history tab with status filter chips (Pending/Contacted/Validated/Rejected/Resolved) and search.<\/p>\n<p>• Built the barangay contacts directory structure and UI for all 28 barangays of San Enrique, Iloilo plus national hotlines, with call/SMS shortcuts and search — actual captain and VAWC officer numbers are not yet populated, pending the Mayor's signed approval to collect barangay-level data.<\/p>\n<p>• Built the laws &amp; ordinances reference module covering 6 related Republic Acts, with category filters and search.<\/p>\n<p>• Built the profile management screen for editing account details and logging out.<\/p>\n<p><strong><u>Web Admin Dashboard (ADMINWEBDASH):<\/u><\/strong><\/p>\n<p>• Designed the relational database schema (admins, reports, report_notes, barangay_contacts, users) with all 28 barangays pre-seeded.<\/p>\n<p>• Built role-based authentication with separate Admin and Super Admin sign-in pages, enforced on both the client and the server.<\/p>\n<p>• Built a one-time bootstrap utility for creating the first Super Admin account, which self-locks after first use.<\/p>\n<p>• Built the Reports management module: view all submitted reports, update status, and log call notes.<\/p>\n<p>• Built Barangay Contacts management, viewable by all admins and editable by Super Admin only.<\/p>\n<p>• Built Registered Users management with permanent delete restricted to Super Admin.<\/p>\n<p>• Built Admin Accounts management (activate/deactivate), restricted to Super Admin.<\/p>\n<p>• Implemented an auto-refreshing dashboard (polls every 15 seconds) so data stays current without a manual reload.<\/p><\/td>\n<td>July 25 – Aug 15, 2026<\/td>\n<td><strong>Rhea Serquillos<\/strong><\/td>\n<td><strong>✓<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Secured the signed approval letter from Engr. Michael B. Dizon, EdD, PhD, ISUFST San Enrique Campus Administrator, granting permission to conduct the capstone study and related data-gathering activities.<\/td>\n<td>Aug 11 – 17, 2026<\/td>\n<td><strong>William Cepriano<\/strong><\/td>\n<td><strong>✓<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Revised the capstone manuscript based on the adviser's and panel's feedback.<\/td>\n<td>Aug 11 – 17, 2026<\/td>\n<td><strong>Kizaih Devecais<\/strong><\/td>\n<td><strong>✓<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Revised the capstone manuscript based on the adviser's and panel's feedback.<\/td>\n<td>Aug 11 – 17, 2026<\/td>\n<td><strong>Rhea Mae Porcal<\/strong><\/td>\n<td><strong>✓<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"week-2-20\">Week 2: 20%<\/h3>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th rowspan=\"2\"><strong>Tasks/Deliverables<\/strong><\/th>\n<th rowspan=\"2\"><strong>Timeline<\/strong><\/th>\n<th rowspan=\"2\"><strong>Person Responsible<\/strong><\/th>\n<th colspan=\"2\"><strong>Remarks<\/strong><\/th>\n<\/tr>\n<tr class=\"odd\">\n<th><strong>Delivered<\/strong><\/th>\n<th><strong>Not Delivered<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><p><strong><u>Mobile Application (KASANGGA — Android):<\/u><\/strong><\/p>\n<p>• Connected the mobile app to the Web Admin Dashboard so data syncs between both platforms.<\/p>\n<p>• Fixed the incident report status display bug — status now updates and appears correctly on both f the Barangay Captain and VAWC Desk Officer of all 28 barangays, using the data gathered in Week 2.<\/p>\n<p>• Improved Lumi’s responses so it gives more accurate guidance on reporting and VAWC concerns in Kinaray-a, Tagalog, or English.<\/p>\n<p>• Expanded the Laws tab to 11 VAWC-related laws, with simple explanations in English or Filipino, Women and Child filters, and a Read More page with a real-life example for each law.<\/p>\n<p>• Added a summary of total, pending, and resolved reports at the top of the Reports tab.<\/p><\/td>\n<td>Aug 27 – Sep 5, 2026<\/td>\n<td><strong>Rhea Serquillos<\/strong><\/td>\n<td><strong>✓<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p><strong><u>Web Admin Dashboard (ADMINWEBDASH):<\/u><\/strong><\/p>\n<p>• Added the Analytics page with summary cards and charts for reports over time, reports by barangay, and incidents by type.<\/p>\n<p>• Added the Retrieve Data option for downloading reports as a CSV file or printing/saving them as a PDF.<\/p>\n<p>• Added the Report Details window for the Super Admin, showing the admin’s call log notes (read-only) and the option to permanently delete a report.<\/p>\n<p>• Made the Barangay Contacts editable by the Super Admin, with changes showing right away in the mobile app.<\/p><\/td>\n<td>Aug 27 – Sep 5, 2026<\/td>\n<td><strong>Rhea Serquillos<\/strong><\/td>\n<td><strong>✓<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><p><strong><u>Adviser’s Nice-to-Have Suggestion — Learn &amp; Play (Playtime) Games:<\/u><\/strong><\/p>\n<p>• Added the Learn &amp; Play section on the Home tab where users can choose between two educational games.<\/p>\n<p>• Built the Trivia Quiz, a 10-question VAWC awareness quiz with a timer, score, and answer streak.<\/p>\n<p>• Built the 4 Pics, 1 Word game with 8 picture-word puzzles about RA 9262 and KASANGGA, with a category clue and a Hint button.<\/p><\/td>\n<td>Aug 27 – Sep 5, 2026<\/td>\n<td><strong>Rhea Serquillos<\/strong><\/td>\n<td><strong>✓<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><p><strong><u>Quality Assurance:<\/u><\/strong><\/p>\n<p>• Prepared 71 test cases covering the mobile app, the web dashboard, and the full report-to-resolution flow for QA testing.<\/p><\/td>\n<td>Aug 27 – Sep 5, 2026<\/td>\n<td><strong>Rhea Serquillos<\/strong><\/td>\n<td><strong>✓<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Checked by:<\/p>\n<blockquote>\n<p><strong>WENDA D. PANES, EdD<\/strong><\/p>\n<p>Adviser<\/p>\n<p>Noted:<\/p>\n<p><strong>______________________<\/strong><\/p>\n<p>Subject Teacher<\/p>\n<\/blockquote>\n<h2 id=\"appendix-h-kasangga-prototype\">Appendix H · KASANGGA Prototype<\/h2>\n\n<p>Mobile Application Interface<\/p>\n<div class=\"tablewrap\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><figure class=\"fig\"><img alt=\"\" height=\"2050\" loading=\"lazy\" src=\"media2/m107.jpg\" width=\"900\"/><\/figure>\n<p><em>Login Interface<\/em><\/p><\/th>\n<th><figure class=\"fig\"><img alt=\"\" height=\"2050\" loading=\"lazy\" src=\"media2/m108.jpg\" width=\"900\"/><\/figure>\n<p><em>Registration Interface<\/em><\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media2/m109.jpg\" width=\"720\"/><\/figure>\n<p><em>Homepage Interface<\/em><\/p><\/td>\n<td><figure class=\"fig\"><img alt=\"\" height=\"1284\" loading=\"lazy\" src=\"media2/m110.jpg\" width=\"720\"/><\/figure>\n<p><em>Submit a Report Interface<\/em><\/p><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media2/m111.jpg\" width=\"720\"/><\/figure>\n<p><em>Contacts Interface<\/em><\/p><\/td>\n<td><figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=\"lazy\" src=\"media2/m112.jpg\" width=\"720\"/><\/figure>\n<p><em>Reports Interface<\/em><\/p><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><figure class=\"fig\"><img alt=\"\" height=\"1544\" loading=     <h2 class="sect">Chapter guide</h2>
    <p class="lead">Jump straight to a chapter, or to the slides that present it.</p>
    <table class="guide"><thead><tr><th>Part</th><th>Manuscript</th><th>Presentation</th></tr></thead><tbody>${CH.map(c => {
      const r = rangeTxt(c.id);
      return `<tr><td class="c1"><div class="ch">${esc(c.label)}<small>${esc(c.id === 'front' ? c.subtitle : subLabel(c))}</small></div></td>
        <td><a class="btnlink" href="#m.${c.id}">${ICON_BOOK} Read</a></td>
        <td>${r ? `<a class="btnlink" href="#s.${RANGES[c.id][0]}">${ICON_PLAY_S} ${r}</a>` : '<span class="none">No slides</span>'}</td></tr>`;
    }).join('')}</tbody></table>
    <p class="foot">Team INNOTRIX · BSIT 4B · College of Informatics and Computing Innovations · Iloilo State University of Fisheries Science and Technology – San Enrique Campus · 2026</p>
  </div>`;

vMs.innerHTML = `<div class="ms">
  <nav class="rail" id="rail" aria-label="Manuscript contents" data-uncommentable>${CH.map(x => `
    <a class="ch-link" data-ch="${x.id}" href="#m.${x.id}">${esc(x.label)}${subLabel(x) ? `<small>${esc(subLabel(x))}</small>` : ''}</a>
    <ul data-sub="${x.id}" hidden>${x.sections.filter(s => s.level <= 3 && !(x.id === 'app' && s.level > 2)).map(s => `<li class="l${s.level}"><a href="#m.${x.id}.${s.id}" data-sec="${sid(x.id, s.id)}">${esc(s.title)}</a></li>`).join('')}</ul>`).join('')}
  </nav>
  <div class="reader">${CH.map((c, idx) => {
    const prev = CH[idx-1], next = CH[idx+1], r = rangeTxt(c.id);
    return `<article class="paper chap" id="chap-${c.id}" hidden>
      <header class="chead"><div class="eyebrow">KASANGGA Manuscript</div>
        <h1>${esc(c.label)}${subLabel(c) ? '<br>' + esc(subLabel(c)) : ''}</h1>
        <div class="slidelinks">${r ? `<span>In the presentation:</span><a class="btnlink" href="#s.${RANGES[c.id][0]}">${ICON_PLAY_S} ${r}</a>` : '<span>This part has no defense slides.</span>'}</div>
      </header>
      <div class="prose">${c.html}</div>
      <nav class="pager" data-uncommentable>${prev ? `<a href="#m.${prev.id}"><small>← Previous</small><b>${esc(prev.label)}</b></a>` : ''}${next ? `<a class="next" href="#m.${next.id}"><small>Next →</small><b>${esc(next.label)}</b></a>` : `<a class="next" href="#s.1"><small>Next →</small><b>Defense Slides</b></a>`}</nav>
    </article>`;
  }).join('')}</div>
  <button class="toc-btn" id="tocBtn" aria-controls="rail" aria-expanded="false" data-uncommentable><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Contents</button>
</div>`;
// namespace heading ids per chapter, add slide chips + comment buttons
CH.forEach(c => {
  const art = document.getElementById('chap-' + c.id);
  art.querySelectorAll('.prose [id]').forEach(el => { el.id = sid(c.id, el.id); });
  art.querySelectorAll('.prose h2[id], .prose h3[id]').forEach(h => {
    const raw = h.id.split('--')[1];
    const list = secSlides[c.id + '#' + raw] || [];
    const d = document.createElement('div'); d.className = 'xref'; d.setAttribute('data-uncommentable', '');
    d.innerHTML = (list.length ? `<span>See in slides:</span>` + list.slice(0,4).map(n => `<a href="#s.${n}" title="${esc(SL[n-1].title)}">${ICON_PLAY}Slide ${n}</a>`).join('') : '') + cbtn('Comment');
    d.querySelector('.cbtn').dataset.for = h.id;
    h.after(d);
  });
});
const rail = document.getElementById('rail'), tocBtn = document.getElementById('tocBtn');
tocBtn.onclick = () => { const o = rail.classList.toggle('open'); tocBtn.setAttribute('aria-expanded', o); };
document.querySelector('.reader').addEventListener('click', () => { if (rail.classList.contains('open')) { rail.classList.remove('open'); tocBtn.setAttribute('aria-expanded', false); } });
rail.addEventListener('click', e => { if (e.target.closest('a')) { rail.classList.remove('open'); tocBtn.setAttribute('aria-expanded', false); } });

let groups = '', g = null;
SL.forEach((x, i) => {
  if (x.group !== g) { if (g) groups += '</div>'; g = x.group; groups += `<h3>${esc(g)}</h3><div class="tgrid">`; }
  groups += `<a href="#s.${i+1}" data-n="${i+1}" title="${i+1}. ${esc(x.title)}"><img src="thumbs/t-${pad(i+1)}.jpg" alt="Slide ${i+1}: ${esc(x.title)}" loading="lazy"><span>${i+1}</span></a>`;
});
groups += '</div>';
vSl.innerHTML = `<div class="pv">
  <section class="stagecol">
    <div class="stage" id="stage">${SL.map((x, i) => `<figure class="slide" id="slide-${i+1}" data-comment-target hidden><img data-src="slides/s-${pad(i+1)}.jpg" alt="Slide ${i+1}: ${esc(x.title)}"></figure>`).join('')}
      <button class="hit l" aria-label="Previous slide" id="hl" data-uncommentable></button><button class="hit r" aria-label="Next slide" id="hr" data-uncommentable></button></div>
    <div class="ctrl" data-uncommentable>
      <div class="nav"><button class="pbtn" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span class="count" id="count"></span>
      <button class="pbtn" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg></button></div>
      <span class="sp"></span>
      <span class="hint">Use ← → keys</span><span class="swipehint">Swipe the slide to move</span>
      ${cbtn('Comment on this slide').replace('class="cbtn"', 'class="cbtn" id="slideComment"')}
      <button class="pbtn" id="fs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Full screen</button>
    </div>
    <div class="slideinfo" id="info"></div>
  </section>
  <aside class="thumbs" id="thumbs" aria-label="All slides" data-uncommentable>${groups}</aside>
</div>`;

let curSlide = 1;
const goSlide = d => { location.hash = 's.' + Math.min(Math.max(1, curSlide + d), SL.length); };
document.getElementById('prev').onclick = () => goSlide(-1);
document.getElementById('next').onclick = () => goSlide(1);
document.getElementById('hl').onclick = () => goSlide(-1);
document.getElementById('hr').onclick = () => goSlide(1);
document.getElementById('fs').onclick = () => { const st = document.getElementById('stage'); (st.requestFullscreen ? st.requestFullscreen() : Promise.reject()).catch(() => {}); };
{ let sx = null; const st = document.getElementById('stage');
  st.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
  st.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) goSlide(dx < 0 ? 1 : -1); sx = null; }); }

/* ---------- views ---------- */
function show(v){
  [['home', vHome], ['m', vMs], ['s', vSl]].forEach(([k, el]) => el.hidden = k !== v);
  document.querySelectorAll('.tabs a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
}
let curChap = null;
function viewMs(cid, sec){
  show('m');
  const c = chById[cid] || CH[0];
  if (curChap !== c.id) {
    curChap = c.id;
    CH.forEach(x => {
      document.getElementById('chap-' + x.id).hidden = x.id !== c.id;
      rail.querySelector(`[data-sub="${x.id}"]`).hidden = x.id !== c.id;
      rail.querySelector(`[data-ch="${x.id}"]`).classList.toggle('on', x.id === c.id);
    });
    setupSpy(c.id);
  }
  if (sec) { const el = document.getElementById(sid(c.id, sec)); if (el) { el.scrollIntoView(); return; } }
  window.scrollTo(0, 0);
}
let spy;
function setupSpy(cid){
  if (spy) spy.disconnect();
  const links = {}; rail.querySelectorAll(`[data-sub="${cid}"] a`).forEach(a => links[a.dataset.sec] = a);
  spy = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting && links[e.target.id]) { Object.values(links).forEach(a => a.classList.remove('on')); links[e.target.id].classList.add('on'); }
  }), {rootMargin:'-60px 0px -70% 0px'});
  document.querySelectorAll(`#chap-${cid} .prose h2[id], #chap-${cid} .prose h3[id]`).forEach(h => spy.observe(h));
}
function loadSlide(k){ const f = document.getElementById('slide-' + k); if (!f) return; const im = f.querySelector('img'); if (!im.src) im.src = im.dataset.src; }
function viewSlides(n){
  show('s');
  n = Math.min(Math.max(1, n | 0 || 1), SL.length);
  const s = SL[n-1];
  document.getElementById('slide-' + curSlide).hidden = true;
  curSlide = n;
  loadSlide(n); loadSlide(n + 1); loadSlide(n - 1);
  document.getElementById('slide-' + n).hidden = false;
  document.getElementById('count').textContent = `${n} / ${SL.length}`;
  let link = '';
  if (s.target) {
    const t = targetLabel(s.target); const [c, sec] = s.target.split('#');
    link = `<a class="readlink" href="#m.${c}${sec ? '.' + sec : ''}">${ICON_BOOK} Read this in the manuscript <small>${esc(t.chap)}${t.sec ? ' › ' + esc(t.sec) : ''}</small></a>`;
  }
  document.getElementById('info').innerHTML = `<div class="eyebrow">${esc(s.group)} · Slide ${n}</div><h1>${esc(s.title)}</h1>${link}`;
  document.querySelectorAll('.tgrid a').forEach(a => a.classList.toggle('on', +a.dataset.n === n));
  const on = document.querySelector('.tgrid a.on'); if (on && matchMedia('(min-width:981px)').matches) on.scrollIntoView({block:'nearest'});
  window.scrollTo(0, 0);
}
function route(){
  const parts = decodeURIComponent(location.hash.slice(1)).split('.');
  if (parts[0] === 'm') viewMs(parts[1] || 'front', parts.slice(2).join('.'));
  else if (parts[0] === 's') viewSlides(+parts[1]);
  else { show('home'); window.scrollTo(0, 0); }
}
addEventListener('hashchange', route);
addEventListener('keydown', e => {
  if (vSl.hidden || e.target.closest('input,textarea,[contenteditable]')) return;
  if (['ArrowRight','PageDown'].includes(e.key)) { e.preventDefault(); goSlide(1); }
  if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); goSlide(-1); }
  if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
});
document.getElementById('themeBtn').onclick = () => {
  const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  r.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('kt', r.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem('kt'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
route();

/* ---------- comments: open the claude.ai comment box from the page ---------- */
(async () => {
  const cm = await (window.claude?.use?.('comments') ?? null);
  if (!cm) return;
  const btns = () => document.querySelectorAll('.cbtn');
  btns().forEach(b => b.hidden = false);
  document.addEventListener('click', async e => {
    const b = e.target.closest('.cbtn'); if (!b) return;
    const target = b.id === 'slideComment' ? document.getElementById('slide-' + curSlide) : document.getElementById(b.dataset.for);
    if (!target) return;
    try { await cm.openComposer({element: target}); }
    catch (err) { if (['unavailable','not_granted','forbidden','capability_disabled','capability_removed'].includes(err?.code)) btns().forEach(x => x.hidden = true); }
  });
})();
</script>
